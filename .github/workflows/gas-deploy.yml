name: gas-deploy

on:
  # Changes to scripts/check-*.mjs are fully tested by quality-check.yml.
  pull_request:
    paths:
      - 'src/gas/apps_script.gs'
      - 'scripts/deploy-gas.mjs'
      - 'scripts/gas-release-gate.mjs'
      - 'AGENTS.md'
      - 'docs/QUALITY_GATES.md'
      - '.github/pull_request_template.md'
      - 'package.json'
      - '.github/workflows/gas-deploy.yml'
  # Automatic release is an initial administrator opt-in. Only successful
  # full CI for a trusted main push can reach production; never PR workflow_run.
  workflow_run:
    workflows: ['quality-check']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '검증만 실행 · 실제 배포 안 함 (권장)'
        required: true
        default: true
        type: boolean
      approve_9294:
        description: '9.294 운영 배포 승인 · dry_run을 끌 때만 켜기'
        required: true
        default: false
        type: boolean

permissions:
  contents: read


jobs:
  validate:
    if: github.event_name != 'workflow_run' || (vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select trusted current main release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GAS_AUTO_DEPLOY_ENABLED: ${{ vars.GAS_AUTO_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gas-release-gate.mjs
      - name: Checkout selected immutable release
        if: github.event_name != 'pull_request' && steps.release.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Verify last successful production GAS source
        id: gas_source
        if: github.event_name == 'workflow_run' && steps.release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/gas-auto-deploy-eligibility.mjs
      - name: Install dependencies
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
      - name: Full release checks
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        env:
          npm_config_script_shell: /bin/bash
        run: npm run check:ci
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      auto_source_changed: ${{ steps.gas_source.outputs.changed }}
      auto_manual_only: ${{ steps.gas_source.outputs.manual_only }}

  deploy:
    # One-time opt-in permits CI-approved main releases without daily dispatch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.validate.outputs.auto_source_changed == 'true' && needs.validate.outputs.auto_manual_only != 'true' && vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    environment: portfolio-production-gas
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'gas-deploy-dry-run' || 'gas-production-deploy' }}
      cancel-in-progress: false
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOY_DRY_RUN: ${{ inputs.dry_run || false }}
      GAS_FIRST_GATE_PHASE: none
      # Historical release candidates are retired from the operator UI.
      GAS_9293_ORPHANED_CLOSE: 'false'
      GAS_9293_RELEASE_APPROVAL: 'false'
      GAS_9294_CLOSE_OWNER_NAV: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      GAS_9294_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_9294 && 'true' || 'false' }}
      GITHUB_SHA: ${{ needs.validate.outputs.sha }}
      GAS_EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only release state before any deployment write
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        run: GAS_DEPLOY_DIAGNOSTIC_ONLY=true node scripts/deploy-gas.mjs
      # Real production changes are blocked when ANY other routed GAS
      # deployment is unverified, public or has an unreviewed version.
      # Exact current v9.281 inventory is BLOCKED: no deploy can start.
      # Dry-run remains available for no-write auth and source checks.
      - name: Require clean full GAS deployment inventory before real deploy
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Read-only full deployment inventory on manual candidate dry-run
        if: env.GAS_9294_CLOSE_OWNER_NAV == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true'
        continue-on-error: true
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      # Historical 9.287-9.292 manual release gates are no longer selectable.
      - name: Verify existing 9.293 owner, 39/39 Snapshot and idle Gate before 9.294
        id: gas9294_gate
        if: env.GAS_9294_CLOSE_OWNER_NAV == 'true' && env.GAS_9294_RELEASE_APPROVAL == 'true' && env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9294-predeploy-readonly.mjs
      - name: Deploy GAS
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_9294_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9294_gate.outputs.verified || 'false' }}
        run: node scripts/deploy-gas.mjs
      - name: Verify real published 9.294 Gate and trade ledger (read-only)
        if: env.GAS_9294_CLOSE_OWNER_NAV == 'true' && env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9294-postdeploy-readonly.mjs
      - name: Activate NH current prices after real GAS deployment
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          # Automated deployments should not re-authenticate NH on every commit.
          # Manual deployments retain the full, explicit sample readback.
          NH_RUNTIME_SKIP_READBACK_IF_ACTIVE: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: node scripts/activate-nh-gas-runtime.mjs
