name: gas-deploy

on:
  # Changes to scripts/check-*.mjs are fully tested by quality-check.yml.
  pull_request:
    paths:
      - 'src/gas/apps_script.gs'
      - 'scripts/deploy-gas.mjs'
      - 'scripts/gas-release-gate.mjs'
      - 'AGENTS.md'
      - 'docs/QUALITY_GATES.md'
      - '.github/pull_request_template.md'
      - 'package.json'
      - '.github/workflows/gas-deploy.yml'
  # Automatic release is an initial administrator opt-in. Only successful
  # full CI for a trusted main push can reach production; never PR workflow_run.
  workflow_run:
    workflows: ['quality-check']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: '9.305 NH 계좌유형 진단: 기본은 읽기 전용 검증'
        required: true
        default: '진단만'
        type: choice
        options: ['진단만', '9.305 실제 배포']

permissions:
  contents: read


jobs:
  validate:
    if: github.event_name != 'workflow_run' || (vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select trusted current main release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GAS_AUTO_DEPLOY_ENABLED: ${{ vars.GAS_AUTO_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gas-release-gate.mjs
      - name: Checkout selected immutable release
        if: github.event_name != 'pull_request' && steps.release.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Verify last successful production GAS source
        id: gas_source
        if: github.event_name == 'workflow_run' && steps.release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/gas-auto-deploy-eligibility.mjs
      - name: Install dependencies
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
      - name: Full release checks
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        env:
          npm_config_script_shell: /bin/bash
        run: npm run check:ci
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      auto_source_changed: ${{ steps.gas_source.outputs.changed }}
      auto_manual_only: ${{ steps.gas_source.outputs.manual_only }}

  deploy:
    # One-time opt-in permits CI-approved main releases without daily dispatch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.validate.outputs.auto_source_changed == 'true' && needs.validate.outputs.auto_manual_only != 'true' && vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    environment: portfolio-production-gas
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == '진단만' && 'gas-deploy-dry-run' || 'gas-production-deploy' }}
      cancel-in-progress: false
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == '진단만' && 'true' || 'false' }}
      GAS_FIRST_GATE_PHASE: none
      # Historical release candidates are retired from the operator UI.
      GAS_9293_ORPHANED_CLOSE: 'false'
      GAS_9293_RELEASE_APPROVAL: 'false'
      GAS_9294_CLOSE_OWNER_NAV: 'false'
      GAS_9294_RELEASE_APPROVAL: 'false'
      GAS_9295_PRICE_MASTER_REUSE: 'false'
      GAS_9295_RELEASE_APPROVAL: 'false'
      GAS_9296_TRADE_UTF8: 'false'
      GAS_9296_RELEASE_APPROVAL: 'false'
      GAS_9297_NAV_TWO_STAGE: 'false'
      GAS_9297_RELEASE_APPROVAL: 'false'
      GAS_9298_NH_FINANCIAL_INCOME: 'false'
      GAS_9298_RELEASE_APPROVAL: 'false'
      GAS_9300_INTEGRATED: 'false'
      GAS_9300_RELEASE_APPROVAL: 'false'
      GAS_9301_NH_DIAGNOSTIC: 'false'
      GAS_9301_RELEASE_APPROVAL: 'false'
      GAS_9302_NH_DIAGNOSTIC: 'false'
      GAS_9302_RELEASE_APPROVAL: 'false'
      GAS_9303_NH_DIAGNOSTIC: 'false'
      GAS_9303_RELEASE_APPROVAL: 'false'
      GAS_9304_NH_DIAGNOSTIC: 'false'
      GAS_9305_ACCOUNT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == '진단만' || inputs.operation == '9.305 실제 배포') && 'true' || 'false' }}
      GAS_9304_RELEASE_APPROVAL: 'false'
      GAS_9305_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == '9.305 실제 배포' && 'true' || 'false' }}
      GITHUB_SHA: ${{ needs.validate.outputs.sha }}
      GAS_EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only release state before any deployment write
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        run: GAS_DEPLOY_DIAGNOSTIC_ONLY=true node scripts/deploy-gas.mjs
      # Real production changes are blocked when ANY other routed GAS
      # deployment is unverified, public or has an unreviewed version.
      # Exact current v9.281 inventory is BLOCKED: no deploy can start.
      # Dry-run remains available for no-write auth and source checks.
      - name: Require clean full GAS deployment inventory before real deploy
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Require clean full GAS deployment inventory on 9.304 dry-run
        if: env.GAS_9304_NH_DIAGNOSTIC == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Verify published 9.303 idle writer and exact ledger before NH diagnostic release
        id: gas9304_gate
        if: env.GAS_9304_NH_DIAGNOSTIC == 'true' && (env.GAS_DEPLOY_DRY_RUN == 'true' || env.GAS_9304_RELEASE_APPROVAL == 'true')
        run: node scripts/gas9298-release-readonly.mjs pre 9.304
      - name: Require clean full GAS deployment inventory on 9.305 dry-run
        if: env.GAS_9305_ACCOUNT_SCOPE == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Verify published 9.304 idle writer and exact ledger before 9.305
        id: gas9305_gate
        if: env.GAS_9305_ACCOUNT_SCOPE == 'true' && (env.GAS_DEPLOY_DRY_RUN == 'true' || env.GAS_9305_RELEASE_APPROVAL == 'true')
        run: node scripts/gas9298-release-readonly.mjs pre 9.305
      - name: Deploy GAS
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_9305_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9305_gate.outputs.verified || 'false' }}
          GAS_9304_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9304_gate.outputs.verified || 'false' }}
        run: node scripts/deploy-gas.mjs
      - name: Verify NH financial income live sample (no token issuance)
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_9304_NH_DIAGNOSTIC == 'true' && env.GAS_9304_RELEASE_APPROVAL == 'true'
        env:
          NH_FINANCE_EXPECTED_VERSION: '9.304'
        run: node scripts/nh-financial-income-coverage-readback.mjs
      - name: Verify NH account scope types after 9.305 deployment (no transaction inquiry)
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_9305_ACCOUNT_SCOPE == 'true' && env.GAS_9305_RELEASE_APPROVAL == 'true'
        run: node scripts/nh-financial-account-scope-readback.mjs
      - name: Activate NH current prices after real GAS deployment
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none' && env.GAS_9298_NH_FINANCIAL_INCOME != 'true' && env.GAS_9304_NH_DIAGNOSTIC != 'true' && env.GAS_9305_ACCOUNT_SCOPE != 'true'
        env:
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          # Automated deployments should not re-authenticate NH on every commit.
          # Manual deployments retain the full, explicit sample readback.
          NH_RUNTIME_SKIP_READBACK_IF_ACTIVE: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: node scripts/activate-nh-gas-runtime.mjs
