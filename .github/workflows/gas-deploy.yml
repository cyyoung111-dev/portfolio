name: gas-deploy

on:
  # Changes to scripts/check-*.mjs are fully tested by quality-check.yml.
  pull_request:
    paths:
      - 'src/gas/apps_script.gs'
      - 'scripts/deploy-gas.mjs'
      - 'AGENTS.md'
      - 'docs/QUALITY_GATES.md'
      - '.github/pull_request_template.md'
      - 'package.json'
      - '.github/workflows/gas-deploy.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/gas/apps_script.gs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Google API 인증·대상 확인만 하고 실제 배포하지 않음'
        required: true
        default: true
        type: boolean

permissions:
  contents: read


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: GAS checks
        run: npm run check:gas

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.GAS_AUTO_DEPLOY_ENABLED == 'true')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'gas-deploy-dry-run' || 'gas-production-deploy' }}
      cancel-in-progress: false
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOY_DRY_RUN: ${{ inputs.dry_run || false }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Deploy GAS
        run: node scripts/deploy-gas.mjs
