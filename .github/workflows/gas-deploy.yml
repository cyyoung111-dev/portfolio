name: gas-deploy

on:
  # Changes to scripts/check-*.mjs are fully tested by quality-check.yml.
  pull_request:
    paths:
      - 'src/gas/apps_script.gs'
      - 'scripts/deploy-gas.mjs'
      - 'scripts/gas-release-gate.mjs'
      - 'AGENTS.md'
      - 'docs/QUALITY_GATES.md'
      - '.github/pull_request_template.md'
      - 'package.json'
      - '.github/workflows/gas-deploy.yml'
  # Automatic release is an initial administrator opt-in. Only successful
  # full CI for a trusted main push can reach production; never PR workflow_run.
  workflow_run:
    workflows: ['quality-check']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '검증만 실행 · 실제 배포 안 함 (권장)'
        required: true
        default: true
        type: boolean
      candidate_version:
        description: '수동 후보 선택 · 9.295는 전체 가격조회 최적화'
        required: true
        default: '9.295'
        type: choice
        options: ['9.294', '9.295', '9.296', '9.297', '9.298']
      approve_9294:
        description: '9.294 운영 배포 승인 · dry_run을 끌 때만 켜기'
        required: true
        default: false
        type: boolean
      approve_9295:
        description: '9.295 운영 배포 승인 · 독립 Writer Gate 선검증 필요'
        required: true
        default: false
        type: boolean

      approve_9296:
        description: '9.296 거래원장 UTF-8 해시 수정 운영 배포 승인'
        required: true
        default: false
        type: boolean
      approve_9297:
        description: '9.297 KB·한화 NAV 원본 저장/평가 분리 운영 배포 승인'
        required: true
        default: false
        type: boolean

      approve_9298:
        description: '9.298 NH 금융소득 읽기 전용 진단 운영 배포 승인'
        required: true
        default: false
        type: boolean

permissions:
  contents: read


jobs:
  validate:
    if: github.event_name != 'workflow_run' || (vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select trusted current main release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GAS_AUTO_DEPLOY_ENABLED: ${{ vars.GAS_AUTO_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gas-release-gate.mjs
      - name: Checkout selected immutable release
        if: github.event_name != 'pull_request' && steps.release.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Verify last successful production GAS source
        id: gas_source
        if: github.event_name == 'workflow_run' && steps.release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/gas-auto-deploy-eligibility.mjs
      - name: Install dependencies
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
      - name: Full release checks
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        env:
          npm_config_script_shell: /bin/bash
        run: npm run check:ci
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      auto_source_changed: ${{ steps.gas_source.outputs.changed }}
      auto_manual_only: ${{ steps.gas_source.outputs.manual_only }}

  deploy:
    # One-time opt-in permits CI-approved main releases without daily dispatch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.validate.outputs.auto_source_changed == 'true' && needs.validate.outputs.auto_manual_only != 'true' && vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    environment: portfolio-production-gas
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'gas-deploy-dry-run' || 'gas-production-deploy' }}
      cancel-in-progress: false
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOY_DRY_RUN: ${{ inputs.dry_run || false }}
      GAS_FIRST_GATE_PHASE: none
      # Historical release candidates are retired from the operator UI.
      GAS_9293_ORPHANED_CLOSE: 'false'
      GAS_9293_RELEASE_APPROVAL: 'false'
      GAS_9294_CLOSE_OWNER_NAV: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.294' && 'true' || 'false' }}
      GAS_9294_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.294' && inputs.approve_9294 && 'true' || 'false' }}
      GAS_9295_PRICE_MASTER_REUSE: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.295' && 'true' || 'false' }}
      GAS_9295_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.295' && inputs.approve_9295 && 'true' || 'false' }}
      GAS_9296_TRADE_UTF8: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.296' && 'true' || 'false' }}
      GAS_9296_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.296' && inputs.approve_9296 && 'true' || 'false' }}
      GAS_9297_NAV_TWO_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.297' && 'true' || 'false' }}
      GAS_9297_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.297' && inputs.approve_9297 && 'true' || 'false' }}
      GAS_9298_NH_FINANCIAL_INCOME: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.298' && 'true' || 'false' }}
      GAS_9298_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version == '9.298' && inputs.approve_9298 && 'true' || 'false' }}
      GITHUB_SHA: ${{ needs.validate.outputs.sha }}
      GAS_EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only release state before any deployment write
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        run: GAS_DEPLOY_DIAGNOSTIC_ONLY=true node scripts/deploy-gas.mjs
      # Real production changes are blocked when ANY other routed GAS
      # deployment is unverified, public or has an unreviewed version.
      # Exact current v9.281 inventory is BLOCKED: no deploy can start.
      # Dry-run remains available for no-write auth and source checks.
      - name: Require clean full GAS deployment inventory before real deploy
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Read-only full deployment inventory on 9.294 dry-run (advisory)
        if: env.GAS_9294_CLOSE_OWNER_NAV == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true'
        continue-on-error: true
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      # 9.295 dry-run is a RELEASE-READINESS check, not just a code preview.
      # The production inventory gate is identical and mandatory. Catch
      # blockers before anyone authorizes a financial GAS deployment.
      - name: Require clean full GAS deployment inventory on 9.295 dry-run
        if: env.GAS_9295_PRICE_MASTER_REUSE == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Require clean full GAS deployment inventory on 9.296 dry-run
        if: env.GAS_9296_TRADE_UTF8 == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Require clean full GAS deployment inventory on 9.297 dry-run
        if: env.GAS_9297_NAV_TWO_STAGE == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Require clean full GAS deployment inventory on 9.298 dry-run
        if: env.GAS_9298_NH_FINANCIAL_INCOME == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Verify published 9.297 idle writer and exact ledger before NH finance diagnostic
        id: gas9298_gate
        if: env.GAS_9298_NH_FINANCIAL_INCOME == 'true' && (env.GAS_DEPLOY_DRY_RUN == 'true' || env.GAS_9298_RELEASE_APPROVAL == 'true')
        run: node scripts/gas9298-release-readonly.mjs pre
      - name: Verify published 9.295 idle writer before UTF-8 correction
        id: gas9296_gate
        if: env.GAS_9296_TRADE_UTF8 == 'true' && (env.GAS_DEPLOY_DRY_RUN == 'true' || env.GAS_9296_RELEASE_APPROVAL == 'true')
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9296-release-readonly.mjs pre
      - name: Verify published 9.296 idle writer and ledger before NAV split
        id: gas9297_gate
        if: env.GAS_9297_NAV_TWO_STAGE == 'true' && (env.GAS_DEPLOY_DRY_RUN == 'true' || env.GAS_9297_RELEASE_APPROVAL == 'true')
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9297-release-readonly.mjs pre
      # Historical 9.287-9.292 manual release gates are no longer selectable.
      - name: Verify existing 9.293 owner, 39/39 Snapshot and idle Gate before 9.294
        id: gas9294_gate
        if: env.GAS_9294_CLOSE_OWNER_NAV == 'true' && env.GAS_9294_RELEASE_APPROVAL == 'true' && env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9294-predeploy-readonly.mjs
      - name: Verify published 9.294 idle writer, ledger v2 and no pending recovery for 9.295
        id: gas9295_gate
        # Preview must prove the SAME safe state as an approved real deploy.
        # A failed read-only gate must fail the run, never be hidden as green.
        if: env.GAS_9295_PRICE_MASTER_REUSE == 'true' && (env.GAS_DEPLOY_DRY_RUN == 'true' || env.GAS_9295_RELEASE_APPROVAL == 'true') && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9295-release-readonly.mjs pre
      - name: Deploy GAS
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_9294_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9294_gate.outputs.verified || 'false' }}
          GAS_9295_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9295_gate.outputs.verified || 'false' }}
          GAS_9296_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9296_gate.outputs.verified || 'false' }}
          GAS_9297_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9297_gate.outputs.verified || 'false' }}
          GAS_9298_LIVE_PREFLIGHT_VERIFIED: ${{ steps.gas9298_gate.outputs.verified || 'false' }}
        run: node scripts/deploy-gas.mjs
      - name: Verify real published 9.294 Gate and trade ledger (read-only)
        if: env.GAS_9294_CLOSE_OWNER_NAV == 'true' && env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9294-postdeploy-readonly.mjs
      - name: Verify published 9.295 writer Gate and trade ledger (read-only)
        if: env.GAS_9295_PRICE_MASTER_REUSE == 'true' && env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9295-release-readonly.mjs post
      - name: Verify published 9.297 NAV release and exact trade ledger (read-only)
        if: env.GAS_9297_NAV_TWO_STAGE == 'true' && env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9297-release-readonly.mjs post
      - name: Verify NH financial income live sample (no token issuance)
        if: env.GAS_9298_NH_FINANCIAL_INCOME == 'true' && env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_9298_RELEASE_APPROVAL == 'true'
        run: node scripts/nh-financial-income-readback.mjs
      - name: Activate NH current prices after real GAS deployment
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none' && env.GAS_9298_NH_FINANCIAL_INCOME != 'true'
        env:
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          # Automated deployments should not re-authenticate NH on every commit.
          # Manual deployments retain the full, explicit sample readback.
          NH_RUNTIME_SKIP_READBACK_IF_ACTIVE: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: node scripts/activate-nh-gas-runtime.mjs
