name: gas-deploy

on:
  # Changes to scripts/check-*.mjs are fully tested by quality-check.yml.
  pull_request:
    paths:
      - 'src/gas/apps_script.gs'
      - 'scripts/deploy-gas.mjs'
      - 'scripts/gas-release-gate.mjs'
      - 'AGENTS.md'
      - 'docs/QUALITY_GATES.md'
      - '.github/pull_request_template.md'
      - 'package.json'
      - '.github/workflows/gas-deploy.yml'
  # Automatic release is an initial administrator opt-in. Only successful
  # full CI for a trusted main push can reach production; never PR workflow_run.
  workflow_run:
    workflows: ['quality-check']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      first_gate_phase:
        description: '최초 gate 전환 전용: bootstrap=유지보수 게시, finalize=검증된 DRAINING 후보 게시. 일반 배포는 none'
        required: true
        default: none
        type: choice
        options: [none, bootstrap, finalize, abort, inspect]
      dry_run:
        description: 'Google API 인증·대상 확인만 하고 실제 배포하지 않음'
        required: true
        default: true
        type: boolean
      approve_9282:
        description: 'GAS v9.282 수동 운영 배포 명시 승인 (승인 전 false)'
        required: true
        default: false
        type: boolean
      approve_9283:
        description: 'GAS v9.283 별도 수동 운영 배포 명시 승인 (승인 전 false)'
        required: true
        default: false
        type: boolean
      approve_9284:
        description: 'GAS v9.284 전체 릴리스 수동 운영 배포 별도 명시 승인 (기본 false)'
        required: true
        default: false
        type: boolean
      approve_9285:
        description: 'GAS v9.285 펀드 전용 릴리스 수동 배포 승인 (기본 false, 소스·호환성 검증 별도)'
        required: true
        default: false
        type: boolean
      approve_9286:
        description: 'GAS v9.286 통합 릴리스 수동 운영 배포 별도 승인 (기본 false, 원장 마이그레이션 사전검증 필수)'
        required: true
        default: false
        type: boolean
      use_9287_fund_hotfix:
        description: '9.287 펀드·Snapshot 단독 후보 소스 선택 (거래원장 v2 제외)'
        required: true
        default: false
        type: boolean
      approve_9287:
        description: '9.287 후보 실운영 배포 별도 승인. 먼저 dry_run=true 실행'
        required: true
        default: false
        type: boolean

permissions:
  contents: read


jobs:
  validate:
    if: github.event_name != 'workflow_run' || (vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select trusted current main release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GAS_AUTO_DEPLOY_ENABLED: ${{ vars.GAS_AUTO_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gas-release-gate.mjs
      - name: Checkout selected immutable release
        if: github.event_name != 'pull_request' && steps.release.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Verify last successful production GAS source
        id: gas_source
        if: github.event_name == 'workflow_run' && steps.release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/gas-auto-deploy-eligibility.mjs
      - name: Install dependencies
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
      - name: Full release checks
        if: github.event_name != 'workflow_run' || (steps.gas_source.outputs.changed == 'true' && steps.gas_source.outputs.manual_only != 'true')
        env:
          npm_config_script_shell: /bin/bash
        run: npm run check:ci
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      auto_source_changed: ${{ steps.gas_source.outputs.changed }}
      auto_manual_only: ${{ steps.gas_source.outputs.manual_only }}

  deploy:
    # One-time opt-in permits CI-approved main releases without daily dispatch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.validate.outputs.auto_source_changed == 'true' && needs.validate.outputs.auto_manual_only != 'true' && vars.GAS_AUTO_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    environment: portfolio-production-gas
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'gas-deploy-dry-run' || 'gas-production-deploy' }}
      cancel-in-progress: false
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOY_DRY_RUN: ${{ inputs.dry_run || false }}
      GAS_FIRST_GATE_PHASE: ${{ inputs.first_gate_phase || 'none' }}
      GAS_9282_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_9282 && 'true' || 'false' }}
      GAS_9283_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_9283 && 'true' || 'false' }}
      GAS_9284_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_9284 && 'true' || 'false' }}
      GAS_9285_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_9285 && 'true' || 'false' }}
      GAS_9286_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_9286 && 'true' || 'false' }}
      GAS_9287_FUND_HOTFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.use_9287_fund_hotfix && 'true' || 'false' }}
      GAS_9287_RELEASE_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_9287 && 'true' || 'false' }}
      GITHUB_SHA: ${{ needs.validate.outputs.sha }}
      GAS_EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only release state before any deployment write
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        run: GAS_DEPLOY_DIAGNOSTIC_ONLY=true node scripts/deploy-gas.mjs
      # Real production changes are blocked when ANY other routed GAS
      # deployment is unverified, public or has an unreviewed version.
      # Exact current v9.281 inventory is BLOCKED: no deploy can start.
      # Dry-run remains available for no-write auth and source checks.
      - name: Require clean full GAS deployment inventory before real deploy
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Read-only full deployment inventory on 9.287 manual dry-run
        if: env.GAS_9287_FUND_HOTFIX == 'true' && env.GAS_DEPLOY_DRY_RUN == 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        continue-on-error: true
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: Deploy GAS
        if: env.GAS_FIRST_GATE_PHASE == 'none'
        run: node scripts/deploy-gas.mjs
      # Inspect is a read-only inventory of the CURRENT deployed release;
      # the Issue860 cutover helper only recognizes historical v9.282 blobs.
      - name: Inspect current GAS deployment inventory (read-only)
        if: env.GAS_FIRST_GATE_PHASE == 'inspect' && env.GAS_DEPLOY_DRY_RUN == 'true'
        run: node scripts/issue507-deployment-inventory-readonly.mjs
      - name: First writer gate maintenance cutover (never resumes writers)
        if: env.GAS_FIRST_GATE_PHASE != 'none' && env.GAS_FIRST_GATE_PHASE != 'inspect'
        run: node scripts/issue860-first-cutover.mjs
      - name: Reject write-enabled inspect
        if: env.GAS_FIRST_GATE_PHASE == 'inspect' && env.GAS_DEPLOY_DRY_RUN != 'true'
        run: exit 2
      # A successful deployment must not conceal failure to activate the
      # primary NH price source. Historical readback probes below are optional.
      - name: Activate NH current prices after real GAS deployment
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && env.GAS_FIRST_GATE_PHASE == 'none'
        env:
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          # Automated deployments should not re-authenticate NH on every commit.
          # Manual deployments retain the full, explicit sample readback.
          NH_RUNTIME_SKIP_READBACK_IF_ACTIVE: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: node scripts/activate-nh-gas-runtime.mjs
      - name: One-time 2026-10-30 central NH 06:00 readback (no new token)
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        run: node scripts/nh-central-probe-20261030.mjs
      # The fixed 2026-10-29 six-code exploration is retained as a diagnostic
      # script, not repeated on every unrelated main push / GAS no-op deploy.
      # Reintroduce only via an explicitly scoped, reviewed read-only workflow.
      - name: Read-only Shinhan 2026-10-30 public index EOD evidence
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        run: node scripts/shinhan-index-live-readback-20261030.mjs
      - name: One-time 2026-10-30 combined GAS Yahoo and Shinhan EOD readback
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        run: node scripts/domestic-crosschecked-live-readback-20261030.mjs
      - name: Read-only closing EOD provider end-to-end sample (no Telegram)
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        run: node scripts/domestic-eod-integration-readback-20261030.mjs
      - name: Verify NH SP500 NASDAQ NASDAQ100 primary index series
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        run: node scripts/nh-index-primary-readback.mjs
      - name: One-time KRX 2026-10-30 official domestic close readback (read-only)
        if: env.GAS_DEPLOY_DRY_RUN != 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        run: node scripts/krx-domestic-close-readback-20261030.mjs
      - name: Verify KRX 37-code source coverage after live GAS deployment
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && env.GAS_FIRST_GATE_PHASE == 'none'
        continue-on-error: true
        run: node scripts/diagnose-krx-held-coverage.mjs --dates "2026-10-12,2026-10-13"
