name: NH PLUG 읽기 전용 진단
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'GAS centralized NH token status (no issuance) or verified night reference in 07:30–08:00 KST'
        required: true
        default: status
        type: choice
        options: [status, night]
permissions:
  contents: read
concurrency:
  group: nhplug-readonly-diagnostic
  cancel-in-progress: false
jobs:
  readonly:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: NH centralized read-only status or night reference
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          NH_CENTRAL_DIAG_MODE: ${{ inputs.probe }}
        run: node scripts/nh-central-diagnostic.mjs
