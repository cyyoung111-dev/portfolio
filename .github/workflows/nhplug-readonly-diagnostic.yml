name: NH PLUG 읽기 전용 진단
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhplug-readonly-diagnostic
  cancel-in-progress: false
jobs:
  readonly:
    runs-on: ubuntu-latest
    environment: portfolio-market-data
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 인증 및 조회 진단
        env:
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
        run: node scripts/nhplug-readonly-diagnostic.mjs
