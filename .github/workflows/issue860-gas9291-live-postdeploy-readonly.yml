name: issue860-gas9291-live-postdeploy-readonly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue860-gas9291-live-postdeploy-readonly.yml'
permissions:
  contents: read
concurrency:
  group: issue860-gas9291-live-postdeploy-readonly
  cancel-in-progress: false
jobs:
  published-postflight:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove exact v9.291 postflight no-write and bounded warm retry
        run: |
          node scripts/check-issue860-gas9291-postdeploy-readonly.mjs
          node scripts/check-issue860-gas9291-readback-retry.mjs
      - name: Independently verify published v9.291, trades v2 and Writer idle (READ ONLY)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue860-gas9291-postdeploy-readonly.mjs
