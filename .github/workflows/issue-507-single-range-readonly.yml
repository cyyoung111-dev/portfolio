name: issue-507-single-range-readonly

# Exact-date independent evidence; strictly no worker invocation or data writes.
on:
  pull_request:
    paths:
      - 'scripts/issue507-single-range-readonly.mjs'
      - '.github/workflows/issue-507-single-range-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-single-range-readonly.mjs'
      - '.github/workflows/issue-507-single-range-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Parse source with Node
        run: node --check scripts/issue507-single-range-readonly.mjs
      - name: Exercise read-only GAS action allowlist and status parser
        run: node scripts/issue507-single-range-readonly.mjs --self-test

  operational-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: portfolio-production-gas
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compare 2025-12-31 single-date vs indexed-range live diagnostics
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-single-range-readonly.mjs
