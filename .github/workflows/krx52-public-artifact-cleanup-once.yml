name: One-time KRX source legacy artifact cleanup
# This workflow only runs when its own file first lands on protected main.
# It removes previously published raw OHLC artifacts only AFTER proving two
# successful encrypted recovery runs remain on GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krx52-public-artifact-cleanup-once.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: krx52-public-legacy-prune-once
  cancel-in-progress: false
jobs:
  prune-source-only:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove strict deletion boundaries offline
        run: node scripts/check-krx-52week-market.mjs
      - name: Enumerate and verify encrypted recovery plus legacy origins (no deletion)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prune-krx52-legacy-public-artifacts.mjs
      - name: Delete only previously verified public legacy KRX OHLC archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prune-krx52-legacy-public-artifacts.mjs --execute
