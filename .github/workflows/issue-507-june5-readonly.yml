name: issue-507-june5-readonly
# Isolated historical diagnostic; never mutate GAS / Sheets or queue markers.
on:
  push:
    branches:
      - main
      - issue-507-june5-readonly-20261019
    paths:
      - '.github/workflows/issue-507-june5-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-507-june5-readonly
  cancel-in-progress: false
jobs:
  june5-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Local read-only request contract tests
        run: node scripts/check-june5-snapshot-readonly.mjs
      - name: June 5 operational GAS Snapshot integrity (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-june5-snapshot-readonly.mjs
