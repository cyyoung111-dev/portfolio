name: Telegram closing data precompute
on:
  # Collect verified EOD references before the 17:00 Telegram delivery window.
  schedule:
    - cron: '50 7 * * 1-5' # 16:50 KST, Monday–Friday
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-close-precompute
  cancel-in-progress: false
jobs:
  precompute:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Collect and validate read-only closing sources
        id: prepare
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/telegram-close-precompute.mjs
      - name: Archive immutable dated public EOD observations
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: .telegram-close-prepared/prepared.json
          retention-days: 2
          if-no-files-found: error
          include-hidden-files: true
