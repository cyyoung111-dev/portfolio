name: NH night 2026-11-02 one-shot read-only probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nh-night-probe-once-20261102.yml
      - scripts/nh-night-probe-once-20261102.mjs # one scoped read-only rerun
  # Deliberately not scheduled: the test is a single push onto main.
permissions:
  contents: read
  issues: write
jobs:
  probe:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read today's cached NH 06:00 reference, no token bootstrap or Telegram send
        id: nh_probe
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/nh-night-probe-once-20261102.mjs
      - name: Post sanitized result to existing issue for readback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f .nh-night-once-result.txt; then
            gh issue comment 826 --repo "$GITHUB_REPOSITORY" --body-file .nh-night-once-result.txt
          else
            gh issue comment 826 --repo "$GITHUB_REPOSITORY" --body "2026-11-02 NH one-shot read-only probe: script did not produce a result file. Check the run; no market-data confirmation."
          fi
