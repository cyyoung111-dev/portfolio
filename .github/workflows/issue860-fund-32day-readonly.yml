name: Issue860 32-day FUND backlog audit (read-only)
# One main-push and optional manual audit. No scheduled or triggered writer.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue860-fund-32day-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue860-fund-32day-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify 7/32-day bounds and no-write contract offline
        run: node scripts/check-issue507-fund-valuation-readonly.mjs
      - name: Read latest 32 days of stored NAV and derived fund status
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {auditFundRows} from './scripts/diagnose-fund-valuation-readonly.mjs';
          const rows=await auditFundRows({
            url:process.env.GAS_WEB_APP_URL,
            token:process.env.GAS_ACCESS_TOKEN,
            days:32,emit:row=>console.log(JSON.stringify({
              kind:'FUND_32DAY_READONLY',...row,
              financeWrites:0,gasDeployments:0,telegramSends:0
            }))
          });
          // An audit can complete even with pending legitimate valuation rows.
          // Label backlog without automatically rewriting any financial sheet.
          const pending=rows.some(x=>x.evaluationPendingDates.length>0
            ||x.snapshotPendingDates.length>0||x.writerBlockedDates.length>0);
          console.log(JSON.stringify({kind:'FUND_32DAY_BACKLOG_VERDICT',
            pending,pendingFunds:rows.filter(x=>x.evaluationPendingDates.length
             ||x.snapshotPendingDates.length||x.writerBlockedDates.length).map(x=>x.code),
            writerInvoked:false}));
          NODE
