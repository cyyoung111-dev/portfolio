name: issue860-gas9291-predeploy-dryrun
on:
  workflow_dispatch:
  # One-time autonomous non-writing rehearsal when this workflow is merged.
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue860-gas9291-predeploy-dryrun.yml'
permissions:
  contents: read
concurrency:
  group: gas-deploy-dry-run
  cancel-in-progress: false
jobs:
  proof-and-dry-run:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOY_DRY_RUN: 'true'
      GAS_9291_WATCHDOG_RECOVERY: 'true'
      GAS_FIRST_GATE_PHASE: 'none'
      GAS_9291_RELEASE_APPROVAL: 'false'
      GITHUB_SHA: ${{ github.sha }}
      GAS_EXPECTED_MAIN_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify v9.291 source pin, manual protection and watchdog regression offline
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
          node scripts/check-issue860-gas9291-source-review.mjs
          node scripts/check-issue860-gas9291-release-gate.mjs
          node scripts/check-issue860-stored-price-watchdog-preview.mjs
      - name: Verify current production v9.289 RAW integrity, ledger v2 and Writer idle
        run: node scripts/issue860-v9290-live-gate.mjs
      - name: Google Apps Script API exact v9.291 release DRY RUN (no writes)
        run: node scripts/deploy-gas.mjs
