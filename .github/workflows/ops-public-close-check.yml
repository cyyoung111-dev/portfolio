name: OPS 20261007 public historical close source check
on:
  push:
    paths: [.github/workflows/ops-public-close-check.yml]
    branches: [ops/diagnose-close-nav-20261007]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe listed securities history sources read-only
        run: |
          node --input-type=module <<'NODE'
          const codes=['005930','000660','441800','458730','266420'];
          for(const code of codes){
            const u='https://fchart.stock.naver.com/sise.nhn?symbol='+code+'&timeframe=day&count=15&requestType=0';
            try{
              const r=await fetch(u,{headers:{'User-Agent':'Mozilla/5.0','Referer':'https://finance.naver.com/'},signal:AbortSignal.timeout(10000)});
              const text=await r.text();
              const dates=[...text.matchAll(/data="(20\d{6})\|([^"]+)"/g)].map(m=>({date:m[1],raw:m[2]}));
              console.log('NAVER_CLOSE',JSON.stringify({code,http:r.status,rows:dates.length,tail:dates.slice(-6)}));
            }catch(e){console.log('NAVER_CLOSE',JSON.stringify({code,error:e.name}))}
          }
          for(const code of ['005930.KS','000660.KS']){
            try{
              const end=Math.floor(Date.parse('2026-10-08T00:00:00Z')/1000),start=end-14*86400;
              const r=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+code+'?period1='+start+'&period2='+end+'&interval=1d',
                {headers:{'User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(12000)});
              const j=await r.json(),x=j.chart?.result?.[0];
              const p=x?.indicators?.quote?.[0]?.close||[];
              console.log('YAHOO_CLOSE',JSON.stringify({code,http:r.status,
                times:(x?.timestamp||[]).slice(-6).map((v,i)=>({date:new Date(v*1000).toISOString().slice(0,10),close:p[p.length-6+i]}))}));
            }catch(e){console.log('YAHOO_CLOSE',JSON.stringify({code,error:e.name}))}
          }
          NODE
