name: Telegram closing market briefing
on:
  # Schedule delivery is best-effort. Multiple staggered triggers help
  # recovery, but only a dated claim can authorize a single Telegram send.
  schedule:
    - cron: '0 8 * * 1-5'  # 17:00 KST PRIMARY: fully published close data only
    - cron: '8 8 * * 1-5'  # 17:08 KST provider/scheduler fallback
    - cron: '17 8 * * 1-5' # 17:17 KST provider/scheduler fallback
    - cron: '31 8 * * 1-5' # 17:31 KST delayed-scheduler recovery
    - cron: '14 9 * * 1-5' # 18:14 KST recovery
    - cron: '17 10 * * 1-5' # 19:17 KST final fallback, 20:00 cutoff
  workflow_run:
    workflows: ['market-briefing-headless', 'gas-deploy']
    types: [completed]
    branches: [main]
  # Deploy and validate this workflow through its normal, claimed send path.
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-close-briefing.yml']
  # Same-day manual rescue on main ONLY, within the same time/date gate.
  # No test Telegram message and no bypass of durable claim checks.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-close-briefing
  cancel-in-progress: false
jobs:
  briefing:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare closing briefing and check durable claim
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/telegram-close-workflow.mjs prepare
      - name: Claim delivery before contacting Telegram
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: .telegram-close-runtime/claim.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Send claimed closing briefing once
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-close-workflow.mjs send
      - name: Archive Telegram API-confirmed SENT proof
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}-sent
          path: .telegram-close-runtime/sent.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
