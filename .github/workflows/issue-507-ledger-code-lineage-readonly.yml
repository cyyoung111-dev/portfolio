name: issue-507-ledger-code-lineage-readonly

# Transaction-ledger-first assessment; no production writes.
on:
  pull_request:
    paths:
      - 'scripts/issue507-ledger-code-lineage-readonly.mjs'
      - 'scripts/issue507-missing-price-provenance-readonly.mjs'
      - 'scripts/issue507-yearend-carry-readonly.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-ledger-code-lineage-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-ledger-code-lineage-readonly.mjs'
      - 'scripts/issue507-missing-price-provenance-readonly.mjs'
      - 'scripts/issue507-yearend-carry-readonly.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-ledger-code-lineage-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate ledger lineage and synthetic old-code carry safely
        run: |
          node --check scripts/issue507-ledger-code-lineage-readonly.mjs
          node scripts/issue507-ledger-code-lineage-readonly.mjs --self-test

  operational-readonly:
    environment: portfolio-production-gas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compare private first-missing code vs trade-name old-code candidates
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-ledger-code-lineage-readonly.mjs
