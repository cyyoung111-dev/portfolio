name: Briefing optional source availability audit (read-only)
# Reuse the existing protected audit route. Source availability is measured
# only; never send Telegram or write Sheets, GAS, pricing history or NAV.
# 2026-11-06 16:31 KST: one-shot read-only post-#976 source reason verification.
# 2026-11-06 16:4x KST: confirm FRED published-session fallback post-#977 (read only).
on:
  push:
    branches: [main, 'feat/issue826-ai8-sec-source-readonly-20261106']
    paths: ['.github/workflows/nh-close-20261102-diagnostic-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: briefing-optional-source-readonly-audit
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && github.run_attempt == 1) ||
       github.event_name == 'workflow_dispatch')
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove source-date selection and no-write audit contract (offline)
        run: node scripts/check-briefing-source-coverage.mjs
      - name: Read current completed-market optional source statuses only
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/audit-briefing-source-gaps-readonly.mjs
      - name: Compare current and prior KRX official source coverage only
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/compare-briefing-krx-prior-readonly.mjs

  ai9_sec_source_audit:
    # Temporary, read-only verification of the user's SEC_USER_AGENT. No
    # production environment, financial writes, or Telegram side effects.
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/feat/issue826-ai8-sec-source-readonly-20261106' &&
      github.event_name == 'push' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read SEC nine issuer and annual statuses only
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          node --input-type=module <<'NODE'
          import {AI_NINE} from './scripts/briefing-ai-nine-sources.mjs';
          const ua=process.env.SEC_USER_AGENT;
          for(const symbol of ['AMZN','NVDA']){
            const item=AI_NINE.find(x=>x.symbol===symbol);
            const resp=await fetch('https://data.sec.gov/api/xbrl/companyfacts/CIK'+item.cik+'.json',{
              headers:{accept:'application/json','user-agent':ua},signal:AbortSignal.timeout(25000)
            });
            if(!resp.ok){console.log('CAPEX_TAG_AUDIT '+JSON.stringify({symbol,status:'HTTP_'+resp.status}));continue;}
            const d=await resp.json();
            const anchors=(d.facts?.['us-gaap']?.Assets?.units?.USD||[]).filter(x=>x.form==='10-K'&&x.fp==='FY'&&!x.start);
            anchors.sort((a,b)=>b.end.localeCompare(a.end)||b.filed.localeCompare(a.filed));
            const a=anchors[0];
            const tags=Object.entries(d.facts?.['us-gaap']||{}).filter(([tag])=>
              /PaymentsToAcquire|PaymentsForCapital|CapitalExpenditures|PropertyPlantAndEquipment|ProductiveAssets/i.test(tag)
            ).map(([tag,fact])=>({tag,annual:(fact.units?.USD||[]).some(x=>x.form==='10-K'&&x.fp==='FY'&&x.end===a?.end&&x.accn===a?.accn),
              matchedCount:(fact.units?.USD||[]).filter(x=>x.form==='10-K'&&x.fp==='FY'&&x.end===a?.end&&x.accn===a?.accn).length}));
            console.log('CAPEX_TAG_AUDIT '+JSON.stringify({symbol,period:a?.end,accn:a?.accn,tags}));
          }
          NODE
