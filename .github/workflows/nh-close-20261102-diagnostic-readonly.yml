name: Briefing optional source availability audit (read-only)
# Reuse the existing protected audit route. Source availability is measured
# only; never send Telegram or write Sheets, GAS, pricing history or NAV.
# 2026-11-06 16:31 KST: one-shot read-only post-#976 source reason verification.
# 2026-11-06 16:4x KST: confirm FRED published-session fallback post-#977 (read only).
on:
  push:
    branches: [main, 'feat/issue826-company-cds-readonly-20261106']
    paths: ['.github/workflows/nh-close-20261102-diagnostic-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: briefing-optional-source-readonly-audit
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && github.run_attempt == 1) ||
       github.event_name == 'workflow_dispatch')
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove source-date selection and no-write audit contract (offline)
        run: node scripts/check-briefing-source-coverage.mjs
      - name: Read current completed-market optional source statuses only
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/audit-briefing-source-gaps-readonly.mjs
      - name: Compare current and prior KRX official source coverage only
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/compare-briefing-krx-prior-readonly.mjs

  cds_dtcc_index_probe:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/feat/issue826-company-cds-readonly-20261106' &&
      github.event_name == 'push' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify public DTCC SEC credit archive index only
        run: |
          node scripts/audit-dtcc-credit-index-readonly.mjs
          echo 'DTCC_SOURCE_READ_ONLY_PROBE_FINISHED'
          node --input-type=module <<'NODE'
          const u='https://kgc0418-tdw-data-0.s3.amazonaws.com/dashboard/Cumulative.json';
          const r=await fetch(u,{signal:AbortSignal.timeout(18000)});
          if(!r.ok)throw Error('DTCC_FILE_INDEX_HTTP_'+r.status);
          const d=await r.json();
          const files=(d.SEC_CR||[]).filter(x=>x.fileName&&x.fullFilePath)
            .sort((a,b)=>String(b.dissemDTM||'').localeCompare(String(a.dissemDTM||'')));
          const x=files[0];
          if(!x)throw Error('DTCC_CREDIT_FILE_METADATA_MISSING');
          console.log('DTCC_CREDIT_FILE_METADATA '+JSON.stringify({
            count:files.length,
            fileName:String(x.fileName).slice(0,130),
            path:String(x.fullFilePath).slice(0,200),
            rowCount:x.rowCount,
            dissemDTM:x.dissemDTM,
            startTs:x.startTs,
            endTs:x.endTs
          }));
          NODE
      - name: Inspect only published DTCC SEC credit CSV column names
        run: |
          set -euo pipefail
          url='https://kgc0418-tdw-data-0.s3.amazonaws.com/sec/eod/SEC_CUMULATIVE_CREDITS_2026_11_05.zip'
          curl --fail --silent --show-error --location --max-time 35 "$url" -o /tmp/dtcc_public_sec_credit.zip
          size=$(stat -c%s /tmp/dtcc_public_sec_credit.zip)
          test "$size" -gt 100 && test "$size" -lt 8000000
          echo "DTCC_PUBLIC_CREDIT_ARCHIVE_BYTES=$size"
          entries=$(unzip -Z -1 /tmp/dtcc_public_sec_credit.zip)
          test "$(printf '%s\n' "$entries" | wc -l)" -eq 1
          case "$entries" in SEC_CUMULATIVE_CREDITS_*.csv) ;; *) exit 6;; esac
          unzip -p /tmp/dtcc_public_sec_credit.zip "$entries" | head -n 1 | cut -c 1-7000 | sed 's/^/DTCC_PUBLIC_CREDIT_HEADERS=/'
          rm -f /tmp/dtcc_public_sec_credit.zip
      - name: Count DTCC SEC candidate issuers and populated CDS price fields only
        run: |
          python3 - <<'PY'
          import csv,io,json,re,urllib.request,zipfile
          url='https://kgc0418-tdw-data-0.s3.amazonaws.com/sec/eod/SEC_CUMULATIVE_CREDITS_2026_11_05.zip'
          with urllib.request.urlopen(url,timeout=35) as response:
              data=response.read(8000001)
          if len(data)>=8000001:
              raise ValueError('DTCC_ARCHIVE_EXCEEDS_SIZE_LIMIT')
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              names=z.namelist()
              if len(names)!=1 or not re.fullmatch(r'SEC_CUMULATIVE_CREDITS_\d{4}_\d{2}_\d{2}\.csv',names[0]):
                  raise ValueError('DTCC_ARCHIVE_SCHEMA_INVALID')
              if z.getinfo(names[0]).file_size>20000000:
                  raise ValueError('DTCC_UNCOMPRESSED_SIZE_TOO_LARGE')
              text=io.TextIOWrapper(z.open(names[0]),encoding='utf-8-sig',newline='')
              rows=list(csv.DictReader(text))
          fields=['Underlying Asset Name','Underlier ID-Leg 1','UPI Underlier Name','UPI FISN']
          keys={'MSFT':['MICROSOFT'],'AAPL':['APPLE INC'],'GOOGL':['ALPHABET','GOOGLE LLC'],'AMZN':['AMAZON'],
            'META':['META PLATFORMS','FACEBOOK'],'NVDA':['NVIDIA'],'MU':['MICRON'],'ORCL':['ORACLE'],
            'SNDK':['SANDISK','SANDISK CORPORATION'],'005930':['SAMSUNG ELECTRONICS'],
            '000660':['SK HYNIX','SKHYINX']}
          candidates={k:0 for k in keys}
          for row in rows:
              context=' | '.join(str(row.get(k) or '').upper() for k in fields)
              for key,tokens in keys.items():
                  if any(token in context for token in tokens):
                      candidates[key]+=1
          checked=['Price','Price notation','Spread-Leg 1','Spread notation-Leg 1',
              'Spread-Leg 2','Spread notation-Leg 2','Fixed rate-Leg 1',
              'Expiration Date','Action type','Underlying Asset Name','Underlier ID-Leg 1']
          counts={key:sum(bool(str(r.get(key) or '').strip()) for r in rows) for key in checked}
          notation={key:sorted({str(r.get(key) or '').strip()[:40] for r in rows if r.get(key)})[:20]
              for key in ['Asset Class','Product name','Price notation','Spread notation-Leg 1',
                'Underlier ID source-Leg 1']}
          print('DTCC_CDS_COLUMN_COVERAGE '+json.dumps({'date':'2026-11-05',
              'rows':len(rows),'nonempty':counts,'distinct':notation,
              'issuerNameCandidates':candidates,'verified5yIssuerSpreads':0},ensure_ascii=False))
          PY
      - name: Check candidate issuer tenor, spread units and event types (counts only)
        run: |
          python3 - <<'PY'
          import csv,io,json,re,urllib.request,zipfile,datetime,collections
          url='https://kgc0418-tdw-data-0.s3.amazonaws.com/sec/eod/SEC_CUMULATIVE_CREDITS_2026_11_05.zip'
          with urllib.request.urlopen(url,timeout=35) as response:
              contents=response.read(8000001)
          if len(contents)>=8000001: raise ValueError('archive size')
          with zipfile.ZipFile(io.BytesIO(contents)) as z:
              name=z.namelist()[0]
              if len(z.namelist())!=1 or z.getinfo(name).file_size>20000000: raise ValueError('zip schema')
              rows=list(csv.DictReader(io.TextIOWrapper(z.open(name),encoding='utf-8-sig',newline='')))
          aliases={'MSFT':['MICROSOFT'],'AAPL':['APPLE INC'],'GOOGL':['ALPHABET','GOOGLE LLC'],
            'AMZN':['AMAZON'],'META':['META PLATFORMS','FACEBOOK'],'NVDA':['NVIDIA'],
            'MU':['MICRON'],'ORCL':['ORACLE'],'SNDK':['SANDISK'],
            '005930':['SAMSUNG ELECTRONICS'],'000660':['SK HYNIX','SKHYINX']}
          def tenor(row):
              a=row.get('Execution Timestamp') or ''
              b=row.get('Expiration Date') or ''
              try:
                  da=datetime.datetime.fromisoformat(a.replace('Z','+00:00'))
                  db=datetime.datetime.fromisoformat(b.replace('Z','+00:00'))
                  if da.tzinfo is None: da=da.replace(tzinfo=datetime.timezone.utc)
                  if db.tzinfo is None: db=db.replace(tzinfo=datetime.timezone.utc)
                  return (db-da).total_seconds()/86400/365.25
              except: return None
          counted={}
          for sym,tokens in aliases.items():
              matches=[]
              for row in rows:
                  context=' | '.join(str(row.get(k) or '').upper() for k in [
                    'Underlying Asset Name','Underlier ID-Leg 1','UPI Underlier Name','UPI FISN'])
                  if any(token in context for token in tokens):matches.append(row)
              direct=[r for r in matches if (r.get('Spread-Leg 1') or '').strip()
                and (r.get('Spread notation-Leg 1') or '').strip() in {'3','4'}]
              five=[r for r in direct if tenor(r) is not None and 4.4<=tenor(r)<=5.6]
              counted[sym]={
                'nameMatches':len(matches),'anySpread':len(direct),
                'near5y':len(five),
                'notation':dict(collections.Counter((r.get('Spread notation-Leg 1') or 'none') for r in matches)),
                'actions':dict(collections.Counter((r.get('Action type') or 'none') for r in matches)),
                'productHints':sorted(set((r.get('UPI FISN') or '').strip()[:90] for r in matches))[:3]
              }
          print('DTCC_CDS_ISSUER_FILTER_STAGE '+json.dumps({
            'date':'2026-11-05','preliminaryNameMatches':counted,
            'verifiedSingleNameSenior5ySpreads':0},ensure_ascii=False))
          PY


