name: krx-holiday-september-readonly

# Versioned, authenticated READ_ONLY checkpoint. Re-run on workflow updates.
# No schedule, no mutation, no raw GAS response or secret in Actions log.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krx-holiday-september-readonly.yml'
  workflow_dispatch:
  # Post-deploy verification must not race the GAS web app rollout.
  # 'gas-deploy' can succeed with only validate run; the deploy job is gated
  # by GAS_AUTO_DEPLOY_ENABLED on push, so mirror that required condition.
  workflow_run:
    workflows: ['gas-deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: krx-holiday-september-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
    environment: portfolio-production-gas
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        vars.GAS_AUTO_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # workflow_run.GITHUB_SHA is the default-branch tip, NOT the deployed SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # GAS v9.235 must be separately verified as deployed before interpreting 08:45 readiness.
      # These aggregate probes only inspect official 2026-10-16 KRX market
      # data and actual held 37 codes. No mutation, credentials or code lists.
      - name: Verify Oct 16 held 37-code KRX exact close coverage (read only)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-krx-held-coverage.mjs --dates "2026-10-16"
      - name: Verify Oct 16 KRX three-market feed and stored snapshot (read only)
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-krx-operational.mjs --dates "2026-10-16"
      - name: 2026-10-09~11 holiday and 2026-09-15~16 snapshot readonly proof
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-holiday-snapshot-readonly.mjs
      # GAS exposes only the last persisted historical attempt shared by 23:10/00:30.
      # Holiday dispositions are read-only and NEVER authorize direct pending deletion.
      # This does NOT prove that both separate trigger executions occurred.
      - name: Read-only trigger, queue and shared last historical attempt
        if: success() || failure()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-backfill-status.mjs
