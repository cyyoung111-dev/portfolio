name: market-briefing-headless

on:
  schedule:
    - cron: '15 21 * * 0-4' # 06:15 KST
    - cron: '30 22 * * 0-4' # 07:30 KST
    - cron: '5 7 * * 1-5'   # 16:05 KST
    - cron: '15 11 * * 1-5' # 20:15 KST
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 처리할 checkpoint
        required: true
        type: choice
        options: [NIGHT_FINAL, MORNING, KRX_FINAL, EVENING]
      trading_date:
        description: 거래일(YYYY-MM-DD, 비우면 KST 오늘)
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 예약 checkpoint 결정 및 실행
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          MANUAL_CHECKPOINT: ${{ inputs.checkpoint }}
          MANUAL_DATE: ${{ inputs.trading_date }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$MANUAL_CHECKPOINT" ]; then
            checkpoint="$MANUAL_CHECKPOINT"
          else
            case "${{ github.event.schedule }}" in
              '15 21 * * 0-4') checkpoint=NIGHT_FINAL ;;
              '30 22 * * 0-4') checkpoint=MORNING ;;
              '5 7 * * 1-5') checkpoint=KRX_FINAL ;;
              '15 11 * * 1-5') checkpoint=EVENING ;;
              *) echo '예약 checkpoint를 결정할 수 없습니다.' >&2; exit 1 ;;
            esac
          fi
          args=(--checkpoint "$checkpoint")
          if [ -n "$MANUAL_DATE" ]; then args+=(--date "$MANUAL_DATE"); fi
          if [ -n "$RUN_SCHEDULE" ]; then args+=(--schedule "$RUN_SCHEDULE"); fi
          if [ -n "$RUN_SCHEDULE" ]; then
            scheduled_at="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GH_API_URL/repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s).created_at;if(!v)process.exit(1);process.stdout.write(v)})")"
            args+=(--scheduled-at "$scheduled_at")
          fi
          node scripts/run-market-briefing-headless.mjs "${args[@]}"
