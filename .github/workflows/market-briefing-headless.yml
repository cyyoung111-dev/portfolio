name: market-briefing-headless

on:
  schedule:
    - cron: '15 21 * * 0-4' # 06:15 KST
    - cron: '30 22 * * 0-4' # 07:30 KST
    - cron: '5 7 * * 1-5'   # 16:05 KST
    - cron: '15 11 * * 1-5' # 20:15 KST
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 처리할 checkpoint
        required: true
        type: choice
        options: [NIGHT_FINAL, MORNING, KRX_FINAL, EVENING]
      trading_date:
        description: 거래일(YYYY-MM-DD, 비우면 KST 오늘)
        required: false
        type: string

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 예약 checkpoint 결정 및 실행
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          MANUAL_CHECKPOINT: ${{ inputs.checkpoint }}
          MANUAL_DATE: ${{ inputs.trading_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_CHECKPOINT" ]; then
            checkpoint="$MANUAL_CHECKPOINT"
          else
            case "${{ github.event.schedule }}" in
              '15 21 * * 0-4') checkpoint=NIGHT_FINAL ;;
              '30 22 * * 0-4') checkpoint=MORNING ;;
              '5 7 * * 1-5') checkpoint=KRX_FINAL ;;
              '15 11 * * 1-5') checkpoint=EVENING ;;
              *) echo '예약 checkpoint를 결정할 수 없습니다.' >&2; exit 1 ;;
            esac
          fi
          args=(--checkpoint "$checkpoint")
          if [ -n "$MANUAL_DATE" ]; then args+=(--date "$MANUAL_DATE"); fi
          if [ -n "$SCHEDULE" ]; then args+=(--schedule "$SCHEDULE"); fi
          node scripts/run-market-briefing-headless.mjs "${args[@]}"
