name: NH 해외 종목마스터 공개 읽기 진단
on:
  pull_request:
    paths:
      - '.github/workflows/nhplug-us-master-public-check.yml'
      - 'scripts/nhplug-us-master-public-check.mjs'
      - 'scripts/check-nhplug-public-master-exit.mjs'
permissions:
  contents: read
jobs:
  public-master:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 진단 종료 상태 회귀 검사
        run: node scripts/check-nhplug-public-master-exit.mjs
      - name: 공개 원천 접근 및 구조 진단
        run: node scripts/nhplug-us-master-public-check.mjs
