name: issue-507-source-only-raw-guard

# Synthetic policy only. NEVER run against user workbook or write Sheets.
on:
  pull_request:
    paths:
      - 'scripts/issue507-source-only-raw-guard.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-source-only-raw-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-source-only-raw-guard.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-source-only-raw-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install test dependencies without lifecycle scripts
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
      - name: Run synthetic source-only raw-row protection test
        run: |
          node --check scripts/issue507-source-only-raw-guard.mjs
          node scripts/issue507-source-only-raw-guard.mjs --self-test
