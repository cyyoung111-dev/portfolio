name: issue-507-ledger-worker-readonly

# Issue #507: one-time post-merge evidence. No schedule or POST mutating action.
on:
  pull_request:
    paths:
      - 'scripts/issue507-ledger-worker-readonly.mjs'
      - 'scripts/check-issue507-worker-trigger-audit.mjs'
      - 'scripts/diagnose-backfill-status.mjs'
      - '.github/workflows/issue-507-ledger-worker-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-ledger-worker-readonly.mjs'
      - 'scripts/check-issue507-worker-trigger-audit.mjs'
      - 'scripts/diagnose-backfill-status.mjs'
      - '.github/workflows/issue-507-ledger-worker-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate script
        run: node --check scripts/issue507-ledger-worker-readonly.mjs
      - name: Test fail-closed aggregate evidence parser
        run: node scripts/issue507-ledger-worker-readonly.mjs --self-test
      - name: Test real GAS read-only CLOCK trigger audit
        run: node scripts/check-issue507-worker-trigger-audit.mjs

  operational-readonly:
    environment: portfolio-production-gas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only hourly worker state and eight-date Snapshot proof
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-ledger-worker-readonly.mjs

  # Lightweight independent status probe: the eight-date historical proof can
  # legitimately time out while GAS has a busy pending worker. Never let that
  # obscure the worker's already persisted heartbeat / deferred queue progress.
  status-only:
    environment: portfolio-production-gas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read only GAS worker clock audit, heartbeat and pending queue
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-backfill-status.mjs
