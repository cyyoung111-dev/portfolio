name: krx-nightly-health

# Daily at 02:30 Asia/Seoul, after the 22:10 / 23:10 / 00:30
# GAS recovery triggers. GitHub schedule times are UTC and may be delayed.
# All requests are authenticated READ_ONLY. No reconciliation apply or Sheet edits.
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krx-nightly-health
  cancel-in-progress: false

jobs:
  check:
    # Live GAS credentials are restricted to main's scheduled or manual runs.
    # A feature-branch workflow_dispatch must skip the entire job.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only GAS trigger and KRX queue diagnosis
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: |
          node scripts/diagnose-backfill-status.mjs > "${RUNNER_TEMP}/krx-nightly-status.json"
      - name: Assess after-nightly KRX recovery checkpoint
        # getAutomationStatus emits safe JSON but returns nonzero for missing
        # triggers. Show the actionable summary EVEN after this failure.
        if: success() || failure()
        run: |
          node scripts/assess-krx-overnight-health.mjs "${RUNNER_TEMP}/krx-nightly-status.json"
