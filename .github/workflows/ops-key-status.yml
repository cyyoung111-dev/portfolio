name: OPS read-only KRX key status
on:
  push:
    branches: [ops/diagnose-close-nav-20261007]
    paths: [.github/workflows/ops-key-status.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
    steps:
      - name: Check existing configured key and source status
        run: |
          node --input-type=module <<'NODE'
          const url=process.env.GAS_WEB_APP_URL;
          const p=new URLSearchParams({action:'getSettings',...(process.env.GAS_ACCESS_TOKEN?{accessToken:process.env.GAS_ACCESS_TOKEN}:{})});
          try {
            const res=await fetch(url,{method:'POST',body:p,redirect:'follow',signal:AbortSignal.timeout(25000)});
            const body=await res.text();let data={};try{data=JSON.parse(body)}catch{}
            const status=(data.data||data).settings?.apiKeyStatus||{};
            console.log('KRX_KEY_STATUS',JSON.stringify({http:res.status,gasVersion:(data.data||data).gasVersion,krxKeyConfigured:status.krxAuthKeyConfigured,
              publicDataKeyConfigured:status.publicDataApiKeyConfigured,available:status.krxAuthKeyConfigured!==undefined,
              error:res.ok?null:'HTTP_'+res.status}));
          }catch(e){console.log('KRX_KEY_STATUS',JSON.stringify({error:e.name}))}
          NODE
