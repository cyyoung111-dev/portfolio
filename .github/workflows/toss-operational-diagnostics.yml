name: toss-operational-diagnostics

# Recheck 2026-10-17 after observed 2026-10-15 HTTP 403 ip-not-allowed.
# One-time PR merge triggers a new LIVE GAS v9.233 OAuth / 005930 quote
# probe. Diagnostic may update token cache/diagnostic ScriptProperties, but
# never writes portfolio Sheets or certifies an Oct 16 daily close.
# The GAS diagnostic can update token cache/diagnostic properties, and does not emulate a mobile browser.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toss-operational-diagnostics.yml'
      - 'scripts/diagnose-toss-operational.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-toss:
    environment: portfolio-production-gas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate live diagnostic script syntax
        run: node --check scripts/diagnose-toss-operational.mjs
      - name: Verify deployed GAS authentication, Toss OAuth and market APIs
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-toss-operational.mjs
