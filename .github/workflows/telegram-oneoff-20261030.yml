name: Telegram one-time 2026-10-30 delayed briefing
# This workflow triggers only when this uniquely named workflow file is first
# added to main. Never edit this file on main after successful delivery.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-oneoff-20261030.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-morning-briefing
  cancel-in-progress: false
jobs:
  send-one-time:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: portfolio-market-data
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare 30 October delayed briefing, check existing claim
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
        run: node scripts/telegram-oneoff-20261030.mjs prepare
      - name: Claim once before Telegram API
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-morning-claim-2026-10-30
          path: .telegram-oneoff-runtime/claim.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Send the prepared delayed market briefing once
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-oneoff-20261030.mjs send
