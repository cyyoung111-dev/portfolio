name: dividend-source-refresh
on:
  workflow_run:
    workflows: [gas-deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dividend-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Gate the one-time approved dividend repair
        id: gate
        env:
          APPROVED_PARENT: c124ce369a2e5feeac2d295c30d729678c7f47b4
        run: |
          echo 'apply=false' >> "$GITHUB_OUTPUT"
          [ "$(git rev-parse HEAD^)" = "$APPROVED_PARENT" ] || exit 0
          echo 'apply=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh official dividend sources and verify stored data
        if: steps.gate.outputs.apply == 'true'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/run-dividend-source-refresh.mjs
