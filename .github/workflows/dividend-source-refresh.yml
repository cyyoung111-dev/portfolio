name: dividend-source-refresh
on:
  # Public ETF cash distributions are published after month-end. Two bounded
  # monthly refreshes catch early publication and subsequent source revisions.
  # Times: 09:30 KST, 5th and 10th calendar day, including holidays.
  schedule:
    - cron: '30 0 5,10 * *'
  workflow_dispatch:
    inputs:
      confirm_refresh:
        description: 실제 ETF분배금이력·DIVDATA 갱신을 승인하려면 REFRESH 입력
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: dividend-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require explicit approval for manual dividend refresh
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_REFRESH: ${{ inputs.confirm_refresh }}
        run: |
          if [ "$CONFIRM_REFRESH" != 'REFRESH' ]; then
            echo 'DIVIDEND_REFRESH_MANUAL_APPROVAL_REQUIRED'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh official dividend sources and verify stored data
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/run-dividend-source-refresh.mjs
