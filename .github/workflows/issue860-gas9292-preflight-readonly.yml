name: issue860-gas9292-preflight-readonly

# One-shot live 9.291 CLOSE / v2 ledger / Writer Gate check after PR merge.
# Reads only: no deploy, no writer repair, no price/NAV/Snapshot mutation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue860-gas9292-preflight-readonly.yml'

permissions:
  contents: read

concurrency:
  group: issue860-gas9292-preflight-readonly
  cancel-in-progress: false

jobs:
  live:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify 9.292 generated source and maintenance release contracts
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --no-package-lock --no-audit --no-fund --ignore-scripts; fi
          node scripts/check-issue860-gas9292-close-state-preview.mjs
          node scripts/check-issue860-gas9292-release-gate.mjs
      - name: Verify live 9.291 settled close, v2 ledger, bounded Writer Gate (GET/POST only)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue860-gas9292-predeploy-readonly.mjs

  release-dry-run:
    needs: live
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GAS_DEPLOY_DRY_RUN: 'true'
      GAS_FIRST_GATE_PHASE: 'none'
      GAS_9292_GATE_SELFHEAL: 'true'
      GAS_9292_RELEASE_APPROVAL: 'false'
      GAS_EXPECTED_MAIN_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Authenticate and check exact 9.292 release without deployment writes
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --no-package-lock --no-audit --no-fund --ignore-scripts; fi
          node scripts/deploy-gas.mjs
