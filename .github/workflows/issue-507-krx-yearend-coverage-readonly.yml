name: issue-507-krx-yearend-coverage-readonly

# Existing production KRX aggregate diagnostics; no GAS/ledger/price writes.
on:
  pull_request:
    paths:
      - 'scripts/issue507-krx-yearend-coverage-readonly.mjs'
      - 'scripts/issue507-yearend-carry-readonly.mjs'
      - 'scripts/issue507-missing-price-provenance-readonly.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-krx-yearend-coverage-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-krx-yearend-coverage-readonly.mjs'
      - 'scripts/issue507-yearend-carry-readonly.mjs'
      - 'scripts/issue507-missing-price-provenance-readonly.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-krx-yearend-coverage-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify security, scope and synthetic KRX aggregator
        run: |
          node --check scripts/issue507-krx-yearend-coverage-readonly.mjs
          node scripts/issue507-krx-yearend-coverage-readonly.mjs --self-test

  operational-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: portfolio-production-gas
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Historical KRX official coverage from preexisting GAS read endpoints
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-krx-yearend-coverage-readonly.mjs
