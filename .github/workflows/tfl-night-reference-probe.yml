name: TFL night futures read-only probe
on:
  pull_request:
    paths:
      - '.github/workflows/tfl-night-reference-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public TFL page without user credentials
        run: |
          set -euo pipefail
          command -v google-chrome
          timeout 45s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=25000 --dump-dom https://nfutures.tradingforaliving.co.kr/ > /tmp/tfl-probe.html 2>/dev/null
          python3 - <<'PY'
          from html.parser import HTMLParser
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, re
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
                  self.hidden=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'): self.hidden+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style') and self.hidden: self.hidden-=1
              def handle_data(self,text):
                  if not self.hidden: self.parts.append(text)
          parser=Text()
          with open('/tmp/tfl-probe.html',encoding='utf-8') as f: parser.feed(f.read())
          text=' '.join(' '.join(parser.parts).split())
          pattern=r'코스피200 야간선물\s+장 마감\s+([\d,]+\.\d{2}).{0,160}?계약\s+([A-Z0-9]+).{0,120}?마지막 시세\s+(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}:\d{2})'
          matches=re.findall(pattern,text)
          now=datetime.now(ZoneInfo('Asia/Seoul'))
          out={'mode':'READ_ONLY','source':'TFL','matches':len(matches),'checkedAt':now.isoformat(timespec='seconds')}
          if len(matches)==1:
              price,contract,date,clock=matches[0]
              out.update({'date':date,'clock':clock,'contract':contract,'value':float(price.replace(',','')),'matchesToday':date==now.date().isoformat(),'endOfSession':clock=='06:00:00'})
          print(json.dumps(out,ensure_ascii=False))
          if len(matches)!=1: raise SystemExit('TFL_PAGE_EXTRACTION_UNVERIFIED')
          PY
