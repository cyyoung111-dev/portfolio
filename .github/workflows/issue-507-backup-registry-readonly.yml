name: issue-507-backup-registry-readonly

# Synthetic contract on PR/push; live GAS reads only after manual dispatch.
on:
  pull_request:
    paths:
      - 'scripts/issue507-backup-registry-readonly.mjs'
      - 'scripts/issue507-supervised-repair-dryrun-readonly.mjs'
      - 'scripts/diagnose-krx-operational.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-backup-registry-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-backup-registry-readonly.mjs'
      - 'scripts/issue507-supervised-repair-dryrun-readonly.mjs'
      - 'scripts/diagnose-krx-operational.mjs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/issue-507-backup-registry-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate production workbook read-only contract
        run: |
          node --check scripts/issue507-backup-registry-readonly.mjs
          test -z "$(node --input-type=module -e "await import('./scripts/issue507-backup-registry-readonly.mjs')")"
          node scripts/issue507-backup-registry-readonly.mjs --self-test

  operational-readonly:
    environment: portfolio-production-gas
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read only backup registry classification and signature status
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-backup-registry-readonly.mjs
