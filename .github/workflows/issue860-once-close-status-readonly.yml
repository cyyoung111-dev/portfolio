name: issue860-once-close-status-readonly
on:
  workflow_dispatch:
  # One protected main-only readback of the CURRENT GAS 9.293 and exact-day
  # Snapshot/Writer Gate; legacy versions remain reviewable in Git history.
  # No scripts.run, NAV import, Snapshot replay, or other financial writes.
  push:
    branches: [main]
    paths: ['.github/workflows/issue860-once-close-status-readonly.yml']
permissions:
  contents: read
concurrency:
  group: issue860-once-close-status-readonly
  cancel-in-progress: false
jobs:
  status:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove one-shot sanitized diagnostic contract offline
        run: node scripts/check-issue860-close-single-status-readonly.mjs
      - name: Verify live Writer Gate GET contract offline (no writes)
        run: node scripts/check-issue860-writer-gate-v9289-readonly.mjs
      - name: Read current published Writer Gate (one GET, no writes)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue860-writer-gate-v9289-readonly.mjs
      - name: Read persisted 9.293 close (one POST, no writes)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue860-close-single-status-readonly.mjs
      - name: Validate Nov12 exact-day Snapshot diagnostic as read only
        run: node scripts/check-nov12-snapshot-readonly.mjs
      - name: Diagnose 2026-11-12 Snapshot 39 expected versus stored (read-only only)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-nov12-snapshot-readonly.mjs
      - name: Verify published 9.293 source, trade ledger and Gate (read only)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue734-gas9293-postdeploy-readonly.mjs
