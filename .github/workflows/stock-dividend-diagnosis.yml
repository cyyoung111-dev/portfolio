name: stock-dividend-diagnosis
on:
  # Manual diagnosis, plus a read-only check only when its own implementation
  # changes on protected main. No schedule or gas-deploy coupling.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run-stock-dividend-diagnosis.mjs'
      - '.github/workflows/stock-dividend-diagnosis.yml'
permissions:
  contents: read
concurrency:
  group: stock-dividend-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Diagnose stock dividend sources without writing financial data
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/run-stock-dividend-diagnosis.mjs
