name: stock-dividend-diagnosis
on:
  workflow_run:
    workflows: [gas-deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-dividend-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Gate the one-time read-only diagnosis
        id: gate
        env:
          APPROVED_PARENT: 406700afe5d0f808e3643b1f94d70ecb94884045
        run: |
          echo 'apply=false' >> "$GITHUB_OUTPUT"
          [ "$(git rev-parse HEAD^)" = "$APPROVED_PARENT" ] || exit 0
          echo 'apply=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Diagnose stock dividend sources without writing financial data
        if: steps.gate.outputs.apply == 'true'
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/run-stock-dividend-diagnosis.mjs
