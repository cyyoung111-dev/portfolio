name: Telegram Saturday afternoon extra test 2026-11-07
# A single user-requested Saturday market-briefing TEST, not a weekday delivery.
# The workflow runs only on its first addition to main and cannot resend a claim.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-saturday-afternoon-test-20261107.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-saturday-20261107-extra-afternoon-once
  cancel-in-progress: false
jobs:
  one-time-afternoon-test:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prove exact first addition of one-time workflow on main
        id: verify
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          file='.github/workflows/telegram-saturday-afternoon-test-20261107.yml'
          [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUSH_AFTER" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUSH_AFTER" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD^)" == "$PUSH_BEFORE" ]]
          [[ "$(git diff --diff-filter=A --name-only HEAD^ HEAD -- "$file")" == "$file" ]]
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check test entrypoint and Saturday-only window
        shell: bash
        run: |
          node --check scripts/telegram-saturday-afternoon-test-20261107.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {testWindow,authorize,PREFIX,CLAIM} from './scripts/telegram-saturday-afternoon-test-20261107.mjs';
          assert.equal(testWindow(new Date('2026-11-07T13:00:00+09:00')),true);
          assert.equal(testWindow(new Date('2026-11-07T11:59:59+09:00')),false);
          assert.equal(testWindow(new Date('2026-11-07T21:00:00+09:00')),false);
          assert.equal(testWindow(new Date('2026-11-08T13:00:00+09:00')),false);
          assert.equal(authorize({eventName:'workflow_dispatch',event:{},instant:new Date('2026-11-07T13:00:00+09:00'),additionVerified:true,attempt:1}),false);
          assert.ok(PREFIX.includes('시험발송') && CLAIM.includes('afternoon'));
          console.log('AFTERNOON_TEST_WINDOW_GUARD_OK');
          NODE
      - name: Prepare official completed-session market briefing (TEST)
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTRA_TEST_ADDITION_VERIFIED: ${{ steps.verify.outputs.verified }}
        run: node scripts/telegram-saturday-afternoon-test-20261107.mjs prepare
      - name: Persist unique claim before any Telegram contact
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.claim }}
          path: .telegram-saturday-extra-runtime/claim.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Send one explicitly labeled Saturday test briefing
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXTRA_TEST_ADDITION_VERIFIED: ${{ steps.verify.outputs.verified }}
        run: node scripts/telegram-saturday-afternoon-test-20261107.mjs send
      - name: Archive Telegram API-confirmed SENT proof
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.claim }}-sent
          path: .telegram-saturday-extra-runtime/sent.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
