name: Telegram close early-armed fallback
on:
  # GitHub schedule is best-effort. Starting a runner earlier reduces
  # exposure to queue delay but DOES NOT guarantee the target minute.
  schedule:
    - cron: '35 7 * * 1-5' # 16:35 KST early-arm; target 17:00 KST
  # External independent scheduler may dispatch, but clock/date gates still apply.
  workflow_dispatch:
  # A reviewed main-only push provides an independent one-file activation path.
  push:
    branches: [main]
    paths: ['ops/telegram-close-arm-trigger.txt']
permissions:
  contents: read
  actions: read
concurrency:
  # Same group as the regular delivery workflow; never two parallel sends.
  group: telegram-close-briefing
  cancel-in-progress: false
  # Preserve pending retries; still serialize all claimed sends.
  queue: max
jobs:
  armed:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact main one-file sentinel commit using checked-out Git diff
        id: verify_sentinel
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'CLOSE_SENTINEL_BEFORE_UNVERIFIED'; exit 1
          fi
          if [ "$PUSH_BEFORE" != "$(git rev-parse HEAD^)" ]; then
            echo 'CLOSE_SENTINEL_MULTI_COMMIT_REJECTED'; exit 1
          fi
          sentinel='ops/telegram-close-arm-trigger.txt'
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [ "$changed" != "$sentinel" ]; then
            echo 'CLOSE_SENTINEL_NOT_EXACT_SINGLE_FILE'; exit 1
          fi
          mode="$(git ls-files --stage "$sentinel" | awk '{print $1}')"
          if [ "$mode" != '100644' ]; then
            echo 'CLOSE_SENTINEL_FILE_MODE_UNVERIFIED'; exit 1
          fi
          if [ "$(wc -c < "$sentinel")" -ge 800 ]; then
            echo 'CLOSE_SENTINEL_FILE_TOO_LARGE'; exit 1
          fi
          if [ "$(grep -Ec '^armed=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+09:00$' "$sentinel" || true)" != 1 ]; then
            echo 'CLOSE_SENTINEL_ARMED_FORMAT_INVALID'; exit 1
          fi
          if [ "$(git show "HEAD^:$sentinel" | grep -Ec '^armed=' || true)" != 1 ]; then
            echo 'CLOSE_SENTINEL_PREVIOUS_FORMAT_INVALID'; exit 1
          fi
          if ! diff -u <(git show "HEAD^:$sentinel" | sed '/^armed=/d') <(sed '/^armed=/d' "$sentinel"); then
            echo 'CLOSE_SENTINEL_OTHER_LINES_CHANGED'; exit 1
          fi
          today="$(TZ=Asia/Seoul date +%F)"
          armed_date="$(sed -nE 's/^armed=([0-9]{4}-[0-9]{2}-[0-9]{2})T[0-9]{2}:[0-9]{2}:[0-9]{2}\+09:00$/\1/p' "$sentinel")"
          if [ "$armed_date" != "$today" ]; then
            echo 'CLOSE_SENTINEL_WRONG_KST_DATE'; exit 1
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Wait for original 17:00 KST guarded delivery window
        id: arm
        env:
          TELEGRAM_CLOSE_SENTINEL_VERIFIED: ${{ github.event_name == 'push' && steps.verify_sentinel.outputs.verified || 'false' }}
        run: node scripts/telegram-punctual-arm.mjs close
      - name: Prepare verified close briefing through original claim and source rules
        if: steps.arm.outputs.ready == 'true'
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/telegram-close-workflow.mjs prepare armed
      - name: Claim original dated briefing before contacting Telegram
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: .telegram-close-runtime/claim.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Send exactly one claimed close briefing
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-close-workflow.mjs send
      - name: Archive Telegram API-confirmed SENT proof
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}-sent
          path: .telegram-close-runtime/sent.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
