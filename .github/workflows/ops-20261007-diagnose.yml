name: OPS 20261007 read-only GAS/KRX diagnoses
on:
  push:
    branches: [ops/diagnose-close-nav-20261007]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
    steps:
      - name: Diagnose GAS automation and official closes
        run: |
          node --input-type=module <<'NODE'
          const endpoint=process.env.GAS_WEB_APP_URL;
          if (!endpoint) { console.log('GAS_WEB_APP_URL_NOT_CONFIGURED'); process.exit(1); }
          async function call(action,fields={}) {
            const data=new URLSearchParams({action,...fields,...(process.env.GAS_ACCESS_TOKEN?{accessToken:process.env.GAS_ACCESS_TOKEN}:{})});
            try {
              const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data,redirect:'follow',signal:AbortSignal.timeout(45000)});
              const body=await response.text();
              let obj={};try{obj=JSON.parse(body)}catch{};
              return {http:response.status,obj,notJson:!Object.keys(obj).length};
            } catch(e) {return {http:0,error:e.name,detail:'network-or-timeout'};}
          }
          const stat=await call('getAutomationStatus');
          const top=stat.obj?.data||stat.obj||{},a=top.automation||{};
          const c=a.portfolioClose||{};
          console.log('STATUS',JSON.stringify({http:stat.http,gasVersion:top.gasVersion,
            status:a.overallStatus,trigger:a.trigger,expectedRunDate:a.expectedPortfolioCloseRunDate,
            portfolioCloseRunStale:a.portfolioCloseRunStale,portfolioClose:a.portfolioClose?{
              runDate:c.runDate,startedAt:c.startedAt,priceOk:c.priceOk,
              priceDate:c.priceDate,priceRows:c.priceRows,fundOk:c.fundOk,errors:c.errors}:null,
            lastError:a.portfolioCloseLastError,priceDate:a.priceHistoryLastDate,
            snapshotDate:a.snapshotLastDate,expectedSnapshotDate:a.expectedSnapshotDate,
            fundLastDate:a.fundLastDate,fundLastError:a.fundLastError,fundLastWarning:a.fundLastWarning,
            errorMessage:top.message||top.error||null}));
          const fund=await call('getFundValuationStatus',{from:'2026-09-22',to:'2026-10-07',code:'F00002'});
          const f=fund.obj?.data||fund.obj||{},fr=f.fundResults?.F00002||{};
          const dates=fr.dates||[];
          console.log('KB',JSON.stringify({http:fund.http,keys:Object.keys(f).slice(0,16),
            error:f.message||f.error||null,results:{
              status:fr.status,storedNav:fr.storedNav,missing:fr.navMissing,
              apiErrors:fr.apiErrors,dates:dates.map(x=>({date:x.date,navState:x.navState})).slice(-18)}}));
          for (const d of ['2026-09-30','2026-10-01','2026-10-02','2026-10-06']) {
            const krx=await call('getKrxOfficialStockCloses',{date:d,codes:'005930,000660'});
            const obj=krx.obj?.data||krx.obj||{};
            console.log('KRX',JSON.stringify({requestDate:d,http:krx.http,requestedDate:obj.requestedDate,
              error:obj.error||obj.message||null,closes:obj.closes||{},
              responseKeys:Object.keys(obj).slice(0,6)}));
          }
          NODE
