name: PR467 final P1 full CI
on:
  push:
    branches:
      - fix/close-price-freshness-kb-nav-recovery

permissions:
  contents: read

jobs:
  full-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run full CI
        run: npm run check:ci
