name: issue-507-jun05-expected-signature

# First-party GAS expected-rows digest only. No ledger/Snapshot write endpoint.
on:
  pull_request:
    paths:
      - 'scripts/issue507-jun05-expected-signature.mjs'
      - '.github/workflows/issue-507-jun05-expected-signature.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-jun05-expected-signature.mjs'
      - '.github/workflows/issue-507-jun05-expected-signature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check immutable diagnostic script syntax
        run: node --check scripts/issue507-jun05-expected-signature.mjs
      - name: Validate exact expected row signature parser contract
        run: node scripts/issue507-jun05-expected-signature.mjs --self-test

  live-readonly:
    environment: portfolio-production-gas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Hash GAS authoritative 2026-06-05 expected 33 rows (no raw values)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-jun05-expected-signature.mjs
