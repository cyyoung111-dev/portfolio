name: krx-verified-pending-finalize

# One-time verified KRX completion marker cleanup. Only 10/12~14/2026.
# The merge that introduces this workflow triggers its one-time push run.
# Subsequent operation is manual; workflow_dispatch defaults to DRY_RUN.
# Existing GAS applies under ScriptLock and re-verifies full Snapshot.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krx-verified-pending-finalize.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Explicitly clear only reverified 2026-10-12~14 pending markers'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: krx-verified-pending-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reverify and optionally clear only the approved KRX dates
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          KRX_FINALIZE_APPLY: ${{ github.event_name == 'push' && '1' || inputs.apply && '1' || '0' }}
        run: |
          node scripts/finalize-verified-krx-pending.mjs
