name: Telegram November 3 07:40 one-off punctual fallback
# One day only: a pre-armed backup for GitHub schedule delays.
# Uses exactly the same guarded source/date/claim/send functions as the regular briefing.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-morning-arm-20261103.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-morning-briefing
  cancel-in-progress: false
  queue: max
jobs:
  morning-once:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Arm for November 3 07:40 KST, fail closed outside the date and original window
        id: arm
        run: |
          python3 - <<'PY'
          import datetime, os, sys, time
          from datetime import timezone, timedelta
          kst = timezone(timedelta(hours=9))
          start = datetime.datetime(2026, 11, 3, 6, 45, tzinfo=kst)
          target = datetime.datetime(2026, 11, 3, 7, 40, tzinfo=kst)
          cutoff = datetime.datetime(2026, 11, 3, 8, 10, tzinfo=kst)
          now = datetime.datetime.now(kst)
          if not (start <= now < cutoff):
              print('MORNING_ONEOFF_OUTSIDE_DAY_OR_WINDOW')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('ready=false\n')
              sys.exit(0)
          print('MORNING_ONEOFF_ARMED_FOR_0740_KST')
          while True:
              remaining = (target - datetime.datetime.now(kst)).total_seconds()
              if remaining <= 0: break
              time.sleep(min(remaining, 10))
          now = datetime.datetime.now(kst)
          ready = target <= now < cutoff
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'ready={str(ready).lower()}\n')
          print('MORNING_ONEOFF_TARGET_REACHED' if ready else 'MORNING_ONEOFF_EXPIRED')
          PY
      - name: Prepare existing verified morning briefing with the original date and claim gates
        if: steps.arm.outputs.ready == 'true'
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {prepareMorning} from './scripts/telegram-morning-workflow.mjs';
          const result=await prepareMorning({
            githubToken:process.env.GITHUB_TOKEN,
            repository:process.env.GITHUB_REPOSITORY,
            attempt:process.env.GITHUB_RUN_ATTEMPT,
            mode:'rescue'
          });
          if(result.ready){
            fs.mkdirSync('.telegram-runtime',{recursive:true});
            fs.writeFileSync('.telegram-runtime/payload.json',JSON.stringify(result));
            fs.writeFileSync('.telegram-runtime/claim.json',JSON.stringify({date:result.date,runId:process.env.GITHUB_RUN_ID}));
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'ready='+String(result.ready)+'\nartifact_name='+(result.artifactName||'')+'\n');
          console.log(JSON.stringify({
            status:result.status,date:result.date,
            referenceSource:result.referenceSource||'NONE',
            referenceOrigin:result.referenceOrigin||'NONE',
            coverage:result.coverage||null
          }));
          JS
      - name: Claim identical dated morning delivery before contacting Telegram
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: .telegram-runtime/claim.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Send exactly one claimed morning briefing inside the original window
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {deliverPrepared} from './scripts/telegram-morning-workflow.mjs';
          import {deliverAndRecordWeekday} from './scripts/telegram-weekday-sent-proof.mjs';
          const payload=JSON.parse(fs.readFileSync('.telegram-runtime/payload.json','utf8'));
          const sent=await deliverAndRecordWeekday(payload,{
            kind:'morning',
            deliver:(message,options)=>deliverPrepared(message,options),
            token:process.env.TELEGRAM_BOT_TOKEN,
            chatId:process.env.TELEGRAM_CHAT_ID,
            attempt:process.env.GITHUB_RUN_ATTEMPT,
            path:'.telegram-runtime/sent.json',
            runId:process.env.GITHUB_RUN_ID||''
          });
          console.log(JSON.stringify(sent));
          JS
      - name: Archive Telegram API-confirmed morning SENT proof
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}-sent
          path: .telegram-runtime/sent.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
