name: kb-fund-nav-collect
on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [issue-507-fund-close-resume]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kb-fund-nav-collect
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Collect exact KB S-T published NAV and verify import
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/collect-kb-fund-nav.mjs --apply
