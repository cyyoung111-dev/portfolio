name: kb-fund-nav-collect
on:
  schedule:
    - cron: '30 0 * * 1-5' # 09:30 KST on weekdays, after previous-day KB NAV becomes public
    # Friday NAV may publish on Saturday after GitHub has skipped an evening
    # wake-up. Catch up on Sunday morning without opening a separate writer.
    - cron: '10 0 * * 0,6' # 09:10 KST Saturday/Sunday; weekend catch-up
    - cron: '10 9 * * *' # 18:10 KST daily; primary evening publication catch-up
    # GitHub schedule is best-effort and the 2026-11-07 18:10 KST event
    # was absent from the actual scheduled-run ledger. Use a staggered
    # second wake-up, not a parallel writer. Existing concurrency and GAS
    # idempotent NAV preview/readback/lease guards stay authoritative.
    - cron: '17 10 * * *' # 19:17 KST daily; delayed/missed-run fallback
  workflow_dispatch:
  # Independent late NAV wake-up when GitHub drops the collector's own cron.
  # Only completed *scheduled* runs of the existing main-only KRX source job
  # can wake protected NAV jobs; push/manual KRX runs never cause an import.
  # The KRX source outcome is NOT an NAV prerequisite: both are independent.
  workflow_run:
    workflows: ['KRX 252-session 52-week market breadth archive (source only)']
    types: [completed]
    branches: [main]
  # One GET-only public source check on the merge that installs this workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/kb-fund-nav-collect.yml'
      - 'scripts/collect-kb-fund-nav.mjs'
      - 'scripts/collect-hanwha-public-nav.mjs'
      - 'scripts/collect-fidelity-public-nav.mjs'
permissions:
  contents: read
concurrency:
  group: kb-fund-nav-collect
  cancel-in-progress: false
jobs:
  # Public source has no GAS token, no private workbook or deployment access.
  # Its failure must not falsely mark the protected import as successful.
  source-public:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/krx-52week-history.yml' && github.event.workflow_run.run_attempt == 1 && github.run_attempt == 1))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Collect public KB S-T NAV independently of GAS
        id: public-nav
        continue-on-error: true
        run: node scripts/collect-kb-fund-nav.mjs --source-only > kb-public-nav.json
      - name: Preserve public KB NAV source for reconciliation
        id: kb-archive
        if: steps.public-nav.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kb-public-nav-${{ github.run_id }}
          path: kb-public-nav.json
          retention-days: 7
          if-no-files-found: error
        continue-on-error: true
      - name: Collect public Hanwha C-RPe NAV independently of GAS
        id: hanwha-public
        continue-on-error: true
        run: node scripts/collect-hanwha-public-nav.mjs > hanwha-public-nav.json
      - name: Preserve public Hanwha NAV source for reconciliation
        id: hanwha-archive
        if: steps.hanwha-public.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hanwha-public-nav-${{ github.run_id }}
          path: hanwha-public-nav.json
          retention-days: 7
          if-no-files-found: error
        continue-on-error: true
      - name: Collect public Fidelity Big4 S-class NAV independently of GAS
        id: fidelity-public
        continue-on-error: true
        run: node scripts/collect-fidelity-public-nav.mjs > fidelity-public-nav.json
      - name: Preserve public Fidelity NAV source for reconciliation
        id: fidelity-archive
        if: steps.fidelity-public.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-public-nav-${{ github.run_id }}
          path: fidelity-public-nav.json
          retention-days: 7
          if-no-files-found: error
        continue-on-error: true
      - name: Record public source coverage without blocking private writer
        if: always()
        env:
          KB_SOURCE_STATUS: ${{ steps.public-nav.outcome }}
          HANWHA_SOURCE_STATUS: ${{ steps.hanwha-public.outcome }}
          KB_ARCHIVE_STATUS: ${{ steps.kb-archive.outcome }}
          HANWHA_ARCHIVE_STATUS: ${{ steps.hanwha-archive.outcome }}
          FIDELITY_SOURCE_STATUS: ${{ steps.fidelity-public.outcome }}
          FIDELITY_ARCHIVE_STATUS: ${{ steps.fidelity-archive.outcome }}
        run: |
          echo "KB public NAV: ${KB_SOURCE_STATUS} / archive: ${KB_ARCHIVE_STATUS}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Hanwha public NAV: ${HANWHA_SOURCE_STATUS} / archive: ${HANWHA_ARCHIVE_STATUS}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Fidelity public NAV: ${FIDELITY_SOURCE_STATUS} / archive: ${FIDELITY_ARCHIVE_STATUS}" >> "${GITHUB_STEP_SUMMARY}"
          # Only KB and Hanwha automatic NAV sources are mandatory.
          # Fidelity manual-NAV reference is advisory and cannot fail them.
          incomplete=0
          if [ "${KB_SOURCE_STATUS}" != "success" ] || [ "${KB_ARCHIVE_STATUS}" != "success" ]; then
            echo "PUBLIC_KB_NAV_UNAVAILABLE"
            incomplete=1
          fi
          if [ "${HANWHA_SOURCE_STATUS}" != "success" ] || [ "${HANWHA_ARCHIVE_STATUS}" != "success" ]; then
            echo "PUBLIC_HANWHA_NAV_UNAVAILABLE"
            incomplete=1
          fi
          # F00003 is source-only reference (manual NAV), not a held
          # automatic KB/Hanwha import. Missing its archive is a warning,
          # never grounds for failing the independent NAV collector.
          if [ "${FIDELITY_SOURCE_STATUS}" != "success" ] || [ "${FIDELITY_ARCHIVE_STATUS}" != "success" ]; then
            echo "PUBLIC_FIDELITY_OPTIONAL_UNAVAILABLE"
          fi
          if [ "${KB_SOURCE_STATUS}" != "success" ] && [ "${HANWHA_SOURCE_STATUS}" != "success" ] && [ "${FIDELITY_SOURCE_STATUS}" != "success" ]; then
            echo "PUBLIC_NAV_ALL_SOURCES_UNAVAILABLE"
          fi
          if [ "$incomplete" -ne 0 ]; then
            exit 1
          fi
  # The private writer independently re-fetches and validates the public NAV.
  # A failed public archive must NEVER skip an otherwise valid import/repair.
  collect:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/krx-52week-history.yml' && github.event.workflow_run.run_attempt == 1 && github.run_attempt == 1))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # A 09:10 weekend cron started at 15:05 KST on 2026-11-14.
      # Fail stale schedules before the slow GAS status probe so the
      # independent NAV rescue can still see an unsuccessful normal run.
      - name: Block stale scheduled NAV starts before private GAS
        env:
          NAV_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/nav-schedule-admission.mjs
      - name: Collect exact KB S-T published NAV and verify import
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/collect-kb-fund-nav.mjs --apply
  # Process F00001 independently even when KB private collector fails.
  # Only GAS v9.284 reviewed collectHanwhaFundNav with the SAME atomic
  # FUND/backfill lease may import; the collector fails closed on any
  # missing source/class/units/provenance or ambiguous commit readback.
  # Workflow-level concurrency serializes the two private jobs.
  hanwha-collect:
    needs: [collect]
    if: always() && github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/krx-52week-history.yml' && github.event.workflow_run.run_attempt == 1 && github.run_attempt == 1))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # A 09:10 weekend cron started at 15:05 KST on 2026-11-14.
      # Fail stale schedules before the slow GAS status probe so the
      # independent NAV rescue can still see an unsuccessful normal run.
      - name: Block stale scheduled NAV starts before private GAS
        env:
          NAV_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/nav-schedule-admission.mjs
      - name: Import exact Hanwha C-RPe NAV through shared GAS FUND/backfill lease
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/collect-hanwha-fund-nav.mjs --apply
  # A successful private NAV import is not proof that the portfolio closeRun
  # completed. Independently verify public class/date, saved derived rows,
  # and authenticated GAS close state after both serial private collectors.
  # This job is GET/preview-only; it cannot authorize a retry or writer.
  postflight-readonly:
    needs: [collect, hanwha-collect]
    if: always() && github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/krx-52week-history.yml' && github.event.workflow_run.run_attempt == 1 && github.run_attempt == 1))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify published KB NAV, saved derived values, and GAS close (read only)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/audit-kb-nav-postflight-readonly.mjs
