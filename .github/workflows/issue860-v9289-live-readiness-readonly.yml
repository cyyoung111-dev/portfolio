name: Issue 860 v9.290 predeployment dry-run - READ ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue860-v9289-live-readiness-readonly.yml'
      - 'scripts/issue860-v9289-live-readiness-readonly.mjs'
      - 'scripts/check-issue860-v9289-live-readiness-readonly.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main'
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: gas-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify 9.290 exact source and guarded manual release contract offline
        run: node scripts/check-issue860-v9290-live-gate.mjs
      - name: Inspect 9.290 GAS candidate and current web-app by exact read-only dry-run
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
          GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_DEPLOY_DRY_RUN: 'true'
          GAS_9290_CLOSE_PERF: 'true'
          GAS_9290_RELEASE_APPROVAL: 'false'
          GAS_EXPECTED_MAIN_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy-gas.mjs
      - name: Probe live 9.290 predeploy gate without allowing any mutation
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: |
          set +e
          node scripts/issue860-v9290-live-gate.mjs
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'ISSUE860_9290_READONLY_PREDEPLOY_GATE_BLOCKED_NO_GAS_WRITE'
          else
            echo 'ISSUE860_9290_READONLY_PREDEPLOY_GATE_VERIFIED_NOT_A_DEPLOYMENT'
          fi
  source-gaps:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main'
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reprobe current KRX stock, turnover and VKOSPI without Telegram
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/audit-briefing-source-gaps-readonly.mjs
