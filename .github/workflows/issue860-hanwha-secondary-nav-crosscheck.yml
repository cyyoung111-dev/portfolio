name: issue860-hanwha-secondary-nav-crosscheck
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/issue860-hanwha-secondary-nav-crosscheck.mjs'
      - 'scripts/check-issue860-hanwha-secondary-nav-crosscheck.mjs'
      - '.github/workflows/issue860-hanwha-secondary-nav-crosscheck.yml'
permissions:
  contents: read
concurrency:
  group: issue860-hanwha-secondary-nav-crosscheck
  cancel-in-progress: false
jobs:
  private-readonly-crosscheck:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate fail-closed preview contract offline
        run: node scripts/check-issue860-hanwha-secondary-nav-crosscheck.mjs
      - name: Compare secondary NAV to stored official class values (READ ONLY)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue860-hanwha-secondary-nav-crosscheck.mjs
