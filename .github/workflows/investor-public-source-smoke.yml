name: Investor public-source read-only probe
on:
  pull_request:
    paths:
      - 'scripts/probe-investor-public-readonly.mjs'
      - 'scripts/probe-investor-integrated-readonly.mjs'
      - 'scripts/briefing-krx-investor-trends.mjs'
      - '.github/workflows/investor-public-source-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check public source schema, no financial writes
        run: node scripts/probe-investor-public-readonly.mjs && node scripts/probe-investor-integrated-readonly.mjs
