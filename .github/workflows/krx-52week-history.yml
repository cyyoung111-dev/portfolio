name: KRX 252-session 52-week market breadth archive (source only)
on:
  # Start a small, source-only bootstrap on the reviewed main merge.
  push:
    branches: [main]
    paths:
      - '.github/workflows/krx-52week-history.yml'
      - 'scripts/krx-52week-market.mjs'
      - 'scripts/collect-krx-52week-history.mjs'
      - 'scripts/krx-52week-archive-crypto.mjs'
  # The KRX OpenAPI daily OHLC is published T+1, not at 18:40.
  # The prior early run fetched the same release-eligible session and its
  # workflow_run completion could needlessly wake private NAV jobs around
  # the separate 19:00 portfolio close. Keep one late weekday run only.
  # Friday's completed data is first eligible Monday and included Monday night.
  schedule:
    - cron: '30 14 * * 1-5' # 23:30 KST, one post-publication backfill
  workflow_dispatch:
    inputs:
      max_dates:
        description: Maximum missing official sessions to fetch (2 KRX markets per date)
        required: true
        type: choice
        default: '30'
        options: ['12', '30', '60']
permissions:
  contents: read
  actions: read
concurrency:
  group: krx-52week-market-source-archive
  cancel-in-progress: false
jobs:
  source-only:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify source-only algorithm before any official API request
        run: node scripts/check-krx-52week-market.mjs
      - name: Restore last validated public KRX OHLC archive, if available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .krx-52week/previous
          # GitHub artifact list order is not a reliable newest-first contract.
          # Earlier runs repeatedly restored an older 11-session archive,
          # discarding newer coverage and needlessly re-requesting old dates.
          previous="$(gh api "repos/$GH_REPOSITORY/actions/artifacts?name=krx-52week-archive&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at, .id) | last | .workflow_run.id // empty')"
          if [ -n "$previous" ]; then
            # Restore only the same main-only source workflow's artifact.
            read -r path branch < <(gh api "repos/$GH_REPOSITORY/actions/runs/$previous" \
              --jq '[.path, .head_branch] | join(" ")')
            if [ "$path" != '.github/workflows/krx-52week-history.yml' ] || [ "$branch" != 'main' ]; then
              echo 'KRX52_ARCHIVE_ORIGIN_UNVERIFIED'; exit 1
            fi
            gh run download "$previous" --repo "$GH_REPOSITORY" \
              --name krx-52week-archive --dir .krx-52week/previous
            # The public repository may expose historical Actions artifacts.
            # Never upload *new* plaintext KRX OHLC. Migrate ONLY the exact
            # previously verified 252-session plaintext source run once.
            if [ -s .krx-52week/previous/history.k52e ]; then
              node scripts/krx-52week-archive-crypto.mjs open \
                .krx-52week/previous/history.k52e \
                .krx-52week/previous/history.json
              echo 'KRX52_ENCRYPTED_ARCHIVE_AUTHENTICATED'
            elif [ "$previous" = '43433853869' ] && [ -s .krx-52week/previous/history.json ]; then
              echo 'KRX52_EXACT_LEGACY_PLAINTEXT_ONE_TIME_UPGRADE'
            else
              echo 'KRX52_ARCHIVE_ENCRYPTION_PROVENANCE_UNVERIFIED'; exit 1
            fi
            test -s .krx-52week/previous/history.json || {
              echo 'KRX52_ARCHIVE_MISSING'; exit 1;
            }
            echo "KRX52_PRIOR_ARCHIVE_RESTORED run=$previous"
          else
            echo 'KRX52_ARCHIVE_BOOTSTRAP_EMPTY'
          fi
      - name: Collect bounded official stock OHLC, retain incomplete status
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          MAX_DATES: ${{ inputs.max_dates }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Two actual 60-date KRX source-only reads passed within the job
          # limit. Continue bounded 60-date backfill on each scheduled slot
          # until all 252 sessions are present. The collector requests only
          # still-missing market pairs, stays sequential and stops on 429/403.
          n=60
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then n="$MAX_DATES"; fi
          node scripts/collect-krx-52week-history.mjs \
            "--input=.krx-52week/previous/history.json" \
            "--output=.krx-52week/history.json" \
            "--summary=.krx-52week/summary.json" \
            "--max-dates=$n"
      - name: Encrypt official raw OHLC before any public Actions upload
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          node scripts/krx-52week-archive-crypto.mjs seal \
            .krx-52week/history.json .krx-52week/history.k52e
      - name: Prove actual production ciphertext is lossless (runner only)
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          set -euo pipefail
          node scripts/krx-52week-archive-crypto.mjs open \
            .krx-52week/history.k52e .krx-52week/reopened.json
          cmp --silent .krx-52week/history.json .krx-52week/reopened.json
          rm .krx-52week/reopened.json
          echo 'KRX52_AUTHENTICATED_SOURCE_ROUNDTRIP_PASS'
      - name: Preserve sealed public-source archive, no portfolio/GAS write
        uses: actions/upload-artifact@v4
        with:
          name: krx-52week-archive
          path: |
            .krx-52week/history.k52e
            .krx-52week/summary.json
          retention-days: 60
          compression-level: 9
          if-no-files-found: error
