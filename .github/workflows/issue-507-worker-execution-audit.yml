name: issue-507-worker-execution-audit

# Read-only Apps Script execution history. NO script.run or Sheet writes.
# 2026-11-11: CLASPRC_JSON refresh has no script.processes OAuth scope.
# 03:17 KST schedule was deterministically failing. Keep manual diagnostic and
# PR source-contract test, but do not run credentialed process audit unattended
# until owner explicitly reauthorizes script.processes for the refresh token.
on:
  pull_request:
    paths:
      - 'scripts/issue507-worker-execution-audit.mjs'
      - '.github/workflows/issue-507-worker-execution-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue507-worker-execution-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify node syntax and privacy-safe process parser
        run: |
          node --check scripts/issue507-worker-execution-audit.mjs
          node scripts/issue507-worker-execution-audit.mjs --self-test

  live-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: portfolio-production-gas
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit hourly GAS worker invocation via processes.listScriptProcesses
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/issue507-worker-execution-audit.mjs --health-check
