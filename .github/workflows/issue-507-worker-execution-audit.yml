name: issue-507-worker-execution-audit

# Read-only Apps Script execution history. NO script.run or Sheet writes.
on:
  pull_request:
    paths:
      - 'scripts/issue507-worker-execution-audit.mjs'
      - '.github/workflows/issue-507-worker-execution-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-worker-execution-audit.mjs'
      - '.github/workflows/issue-507-worker-execution-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify node syntax and privacy-safe process parser
        run: |
          node --check scripts/issue507-worker-execution-audit.mjs
          node scripts/issue507-worker-execution-audit.mjs --self-test

  live-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: portfolio-production-gas
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit hourly GAS worker invocation via processes.listScriptProcesses
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/issue507-worker-execution-audit.mjs
