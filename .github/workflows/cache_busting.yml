# Legacy cache-busting process kept for an optional human-readable audit.
# Previously this ran on EVERY main push and attempted to rewrite root
# index.html. That file only redirects to src/web/index.html and has no local
# script src references, so each run did zero useful cache work and risked
# creating a new main commit -> fresh CI/Pages/GAS eligibility cycle.
# The actual PWA versioned assets and service-worker cache names are checked
# in src/web/index.html + src/web/sw.js by full quality-check on every PR.
name: Cache Busting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-version-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify PWA cache version contract without committing
        run: node scripts/check-web-structure.mjs
