name: NH night reference capture
on:
  # Multiple spaced chances for best-effort GitHub scheduling.
  # Daily artifact existence is checked before querying NH (see step below).
  schedule:
    - cron: '31 22 * * 0-4' # 07:31 KST, primary
    - cron: '39 22 * * 0-4' # 07:39 KST, retry
    - cron: '47 22 * * 0-4' # 07:47 KST, retry
    - cron: '55 22 * * 0-4' # 07:55 KST, final retry; existing artifact gate avoids duplicate NH calls
permissions:
  contents: read
  actions: read
concurrency:
  group: nh-night-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check previously captured reference before GAS request
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Seoul date +%F)"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=nh-night-reference-${today}&per_page=100" --jq '.total_count')"
          if ! [[ "$existing" =~ ^[0-9]+$ ]]; then
            echo 'NH_ARTIFACT_LOOKUP_INVALID' >&2
            exit 1
          fi
          if [ "$existing" -gt 0 ]; then
            echo 'run_capture=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_capture=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Capture NH reference
        if: steps.prior.outputs.run_capture == 'true'
        id: capture
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/nh-morning-capture.mjs
      - name: Save dated reference
        if: steps.capture.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nh-night-reference-${{ steps.capture.outputs.date }}
          path: .nh-night-runtime/reference.json
          retention-days: 2
          if-no-files-found: error
          include-hidden-files: true
