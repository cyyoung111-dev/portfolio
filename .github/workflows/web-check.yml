name: web-check

on:
  # Changes to scripts/check-*.mjs are fully tested by quality-check.yml.
  pull_request:
    paths:
      - 'src/web/**'
      - 'package.json'
      - '.github/workflows/web-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/web/**'
      - 'package.json'
      - '.github/workflows/web-check.yml'

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          

      - name: Install deps (if lockfile exists)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock --no-audit --no-fund
          fi

      - name: Run web checks
        run: npm run check:web:ci

      - name: Web check summary
        if: always()
        run: npm run check:web:report >> $GITHUB_STEP_SUMMARY
