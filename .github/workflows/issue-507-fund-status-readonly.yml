name: issue-507-fund-status-readonly
on:
  workflow_dispatch:
  # One bounded read-only production diagnosis after the workflow revision lands.
  # Ordinary code pushes never gain privileged GAS inspection access.
  push:
    branches: [main]
    paths: ['.github/workflows/issue-507-fund-status-readonly.yml']
permissions:
  contents: read
concurrency:
  group: issue507-fund-status-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.run_attempt == 1))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test pinned 9.285 fund no-op and weekend carry guards (offline)
        # Candidate is synthesized in memory from reviewed 9.284; never deployed.
        run: node scripts/check-gas9285-fund-noop-preview.mjs
      # 2026-11-08: Persisted FUND TIMEOUT is a fail-closed diagnostic; skip
      # 330-second GAS continuation PREVIEW while keeping auth/status probes.
      - name: Read-only fund close status and bounded resume preflight
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          RESUME_READ_ONLY: '1'
        run: node scripts/run-incomplete-close-resume.mjs
      # 2026-11-06 C-RPe collector promotion: self-file push reruns
      # independent protected READ_ONLY source/NAV/lease preflight before use.
      # 2026-11-06 v9.284/341 reconciliation: independent probes all run,
      # even if the first reports a blocked close; none may write financial data.
      - name: Classify persisted GAS close and FUND checkpoint (read only)
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {runBackfillStatus} from './scripts/diagnose-backfill-status.mjs';
          import {describeFundCloseCheckpoint} from './scripts/assess-krx-overnight-health.mjs';
          try {
            const status=await runBackfillStatus({
              url:process.env.GAS_WEB_APP_URL,token:process.env.GAS_ACCESS_TOKEN
            });
            const evidence=describeFundCloseCheckpoint(status);
            // The best-effort checkpoint has no execution/owner linkage.
            // Never claim it identifies the timed-out production attempt.
            console.log(JSON.stringify({kind:'GAS_CLOSE_READONLY_EVIDENCE',
              ...evidence,checkpointCorrelation:'UNVERIFIED_NO_OWNER_LINK',
              operationalVerdict:evidence.closeState==='COMPLETE' &&
                evidence.priceOk===true && evidence.fundOk===true
                ? 'CLOSE_MARKER_COMPLETE' : 'CLOSE_MARKER_NOT_COMPLETE',
              financialWrites:0,gasDeployments:0,telegramSends:0}));
            if(evidence.closeState!=='COMPLETE' || evidence.priceOk!==true
              || evidence.fundOk!==true)process.exitCode=2;
          } catch {
            console.error('GAS_CLOSE_READONLY_EVIDENCE_UNAVAILABLE');
            process.exitCode=2;
          }
          NODE
      - name: Inspect stored fund NAV, price-history and Snapshot states (read only)
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-fund-valuation-readonly.mjs
      - name: Inspect 32-day fund NAV and Snapshot backlog (read only)
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {auditFundRows} from './scripts/diagnose-fund-valuation-readonly.mjs';
          const rows=await auditFundRows({
            url:process.env.GAS_WEB_APP_URL,
            token:process.env.GAS_ACCESS_TOKEN,
            days:32,emit:row=>console.log(JSON.stringify({
              kind:'FUND_32DAY_READONLY',...row,
              financeWrites:0,gasDeployments:0,telegramSends:0
            }))
          });
          console.log(JSON.stringify({kind:'FUND_32DAY_BACKLOG_VERDICT',
            pending:rows.some(x=>x.evaluationPendingDates.length>0
              ||x.snapshotPendingDates.length>0||x.writerBlockedDates.length>0),
            pendingFunds:rows.filter(x=>x.evaluationPendingDates.length
              ||x.snapshotPendingDates.length||x.writerBlockedDates.length).map(x=>x.code),
            writerInvoked:false}));
          NODE
      - name: Verify KB AQ018 exact source and pending import (preview only)
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/collect-kb-fund-nav.mjs
      # Public-only date signal: a successful KB import job may have zero candidates
      # when the latest class NAV has not yet been published. Report dates only;
      # never expose class NAV amounts, credential material or GAS state here.
      - name: Verify latest published KB AQ018 source date (no NAV amounts)
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {runPublicSourceOnly} from './scripts/collect-kb-fund-nav.mjs';
          const r=await runPublicSourceOnly();
          console.log(JSON.stringify({kind:'KB_PUBLIC_LAST_PUBLISHED_DATE',
            latestDate:r.latestDate,cutoffExclusive:r.historicalCutoffExclusive,
            sourceRows:r.sourceRows,writerInvoked:false}));
          NODE
      - name: Verify Hanwha C-RPe exact source and shared-writer readiness (preview only)
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/collect-hanwha-fund-nav.mjs
