name: Telegram morning market briefing
on:
  # GitHub schedule is best-effort; stagger non-hour-boundary retries.
  # A single dated artifact claim prevents duplicate Telegram delivery.
  schedule:
    - cron: '40 22 * * 0-4' # 07:40 KST, primary
    - cron: '49 22 * * 0-4' # 07:49 KST, fallback 1
    - cron: '57 22 * * 0-4' # 07:57 KST, fallback 2
    - cron: '5 23 * * 0-4'  # 08:05 KST, last fallback (08:10 cutoff)
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-morning-briefing
  cancel-in-progress: false
jobs:
  briefing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Manual connection test only
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MANUAL_TEST: 'true'
        run: node scripts/telegram-morning-briefing.mjs
      - name: Prepare scheduled briefing and inspect durable claim
        id: prepare
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/telegram-morning-workflow.mjs prepare
      - name: Claim delivery date before contacting Telegram
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: .telegram-runtime/claim.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Send claimed briefing once
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-morning-workflow.mjs send
