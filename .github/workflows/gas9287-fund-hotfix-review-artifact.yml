name: GAS 9.287 fund Snapshot isolated review (NO DEPLOY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gas9287-fund-hotfix-review-artifact.yml'
  pull_request:
    paths:
      - 'scripts/stage-gas9287-fund-hotfix-review-artifact.mjs'
      - 'scripts/compose-fund-snapshot-9287-source-preview.mjs'
      - 'scripts/compose-gas9286-snapshot-timing-probe.mjs'
      - 'scripts/snapshot-backup-read-optimization-preview.mjs'
      - 'scripts/check-gas9287-fund-snapshot-isolation.mjs'
      - 'scripts/check-gas9286-snapshot-timing-probe.mjs'
      - 'scripts/check-snapshot-backup-read-optimization.mjs'
      - 'reference/gas-v9.285.gs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/gas9287-fund-hotfix-review-artifact.yml'
permissions:
  contents: read
jobs:
  source-review:
    if: github.repository == 'cyyoung111-dev/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact pinned 9.285 fund source, independent 9.287 hotfix, and no trade v2
        run: |
          node scripts/check-gas9287-fund-snapshot-isolation.mjs
          node scripts/check-snapshot-backup-read-optimization.mjs
          node scripts/check-gas9286-snapshot-timing-probe.mjs
      - name: Prepare immutable 9.287 source review artifact (blocked from deploy)
        run: node scripts/stage-gas9287-fund-hotfix-review-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gas9287-fund-only-review-${{ github.sha }}
          path: artifacts/gas9287-fund-review/
          retention-days: 30
