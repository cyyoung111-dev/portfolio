name: GAS 9.287 fund Snapshot isolated review (NO DEPLOY)
on:
  workflow_dispatch:
  # After this change is merged, re-read BOTH production HEAD and the
  # published deployment. Do not infer rollback state from a failed job alone.
  push:
    branches: [main]
    paths:
      - '.github/workflows/gas9287-fund-hotfix-review-artifact.yml'
  pull_request:
    paths:
      - 'scripts/stage-gas9287-fund-hotfix-review-artifact.mjs'
      - 'scripts/compose-fund-snapshot-9287-source-preview.mjs'
      - 'scripts/compose-gas9286-snapshot-timing-probe.mjs'
      - 'scripts/snapshot-backup-read-optimization-preview.mjs'
      - 'scripts/check-gas9287-fund-snapshot-isolation.mjs'
      - 'scripts/check-gas9286-snapshot-timing-probe.mjs'
      - 'scripts/check-snapshot-backup-read-optimization.mjs'
      - 'reference/gas-v9.285.gs'
      - 'src/gas/apps_script.gs'
      - '.github/workflows/gas9287-fund-hotfix-review-artifact.yml'
permissions:
  contents: read
jobs:
  source-review:
    if: github.repository == 'cyyoung111-dev/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact pinned 9.285 fund source, independent 9.287 hotfix, and no trade v2
        run: |
          node scripts/check-gas9287-fund-snapshot-isolation.mjs
          node scripts/check-snapshot-backup-read-optimization.mjs
          node scripts/check-gas9286-snapshot-timing-probe.mjs
      - name: Prepare immutable 9.287 source review artifact (blocked from deploy)
        run: node scripts/stage-gas9287-fund-hotfix-review-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gas9287-fund-only-review-${{ github.sha }}
          path: artifacts/gas9287-fund-review/
          retention-days: 30

  live-deployment-readiness:
    # Once after main merge: inspect production Apps Script project HEAD/deployment.
    # No Sheets reads, file writes, deployment version minting or publishing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    needs: source-review
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact reviewed 9.287 source against live project in dry-run
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
          GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_9287_FUND_HOTFIX: 'true'
          GAS_9287_RELEASE_APPROVAL: 'false'
          GAS_DEPLOY_DRY_RUN: 'true'
          GAS_EXPECTED_MAIN_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy-gas.mjs
      - name: Inventory all GAS deployments before any release (read-only)
        continue-on-error: true
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/issue507-deployment-inventory-readonly.mjs
