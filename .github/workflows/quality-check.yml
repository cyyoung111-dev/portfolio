name: quality-check

# A scripts/check-*.mjs edit must execute that checker, not merely trigger
# unrelated GAS or web subsets. The coverage gate rejects unconnected checks.
on:
  # Required status checks must be created on every pull request. Do not
  # filter the pull_request event by paths or branches: skipped workflows
  # otherwise leave required checks pending and block unrelated PRs.
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'scripts/check-*.mjs'
      - 'package.json'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/gas-deploy.yml'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
      - name: Verify every check script and run full CI
        env:
          npm_config_script_shell: /bin/bash
          npm_config_node_options: ''
          NODE_OPTIONS: ''
        run: test ! -f .npmrc && npm run check:ci
