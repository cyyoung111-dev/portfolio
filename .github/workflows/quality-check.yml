name: quality-check

# A scripts/check-*.mjs edit must execute that checker, not merely trigger
# unrelated GAS or web subsets. The coverage gate rejects unconnected checks.
on:
  pull_request:
    paths:
      - 'scripts/check-*.mjs'
      - 'package.json'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/gas-deploy.yml'
      - '.github/workflows/web-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'scripts/check-*.mjs'
      - 'package.json'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/gas-deploy.yml'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock --no-audit --no-fund
          fi
      - name: Verify every check script and run full CI
        run: npm run check:ci
