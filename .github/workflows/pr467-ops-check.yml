name: PR467 read-only GAS operational status

on:
  push:
    branches:
      - fix/close-price-freshness-kb-nav-recovery

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Query read-only automation and fund status
        run: |
          node --input-type=module <<'NODE'
          const endpoint=process.env.GAS_WEB_APP_URL||'';
          if(!endpoint){console.log(JSON.stringify({status:'GAS_URL_NOT_CONFIGURED'}));process.exit(0)}
          async function query(action,params={}){
            const body=new URLSearchParams({action,...params,...(process.env.GAS_ACCESS_TOKEN?{accessToken:process.env.GAS_ACCESS_TOKEN}:{})});
            try{
              const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body,redirect:'follow',signal:AbortSignal.timeout(35000)});
              const txt=await res.text();let data={};try{data=JSON.parse(txt)}catch{}
              return {http:res.status,data};
            }catch(e){return {error:e.name,message:'network_or_timeout'}}
          }
          const status=await query('getAutomationStatus');
          const a=status.data?.automation||status.data?.data?.automation||{};
          console.log(JSON.stringify({operation:'getAutomationStatus',http:status.http,error:status.error,
            gasVersion:status.data?.gasVersion||status.data?.data?.gasVersion||null,
            overallStatus:a.overallStatus,triggerClose:a.trigger?.hasClose,
            portfolioClose:a.portfolioClose?{runDate:a.portfolioClose.runDate,priceOk:a.portfolioClose.priceOk,
              priceDate:a.portfolioClose.priceDate,priceRows:a.portfolioClose.priceRows,fundOk:a.portfolioClose.fundOk,
              errorCount:a.portfolioClose.errors?.length||0}:null,
            portfolioCloseLastError:a.portfolioCloseLastError?.slice(0,250),
            fundLastWarning:a.fundLastWarning?.slice(0,250),
            fundLastError:a.fundLastError?.slice(0,250),
            fundLastDate:a.fundLastDate,priceHistoryLastDate:a.priceHistoryLastDate}));
          const fund=await query('getFundValuationStatus',{from:'2026-09-22',to:'2026-10-06',code:'F00002'});
          const f=fund.data?.fundResults?.F00002||fund.data?.data?.fundResults?.F00002||{};
          const dates=f.dates||[];
          console.log(JSON.stringify({operation:'getFundValuationStatus',http:fund.http,error:fund.error,
            numDates:dates.length,navStates:dates.reduce((acc,x)=>(acc[x.navState]=(acc[x.navState]||0)+1,acc),{}),
            lastStates:dates.slice(-5).map(x=>({date:x.date,navState:x.navState}))}));
          NODE
