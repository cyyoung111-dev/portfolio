name: GAS production deployment inventory (read-only)
on:
  workflow_dispatch:
    inputs:
      verify_9301:
        description: '9.301 NH 진단 후보 읽기 전용 사전검증 (실제 배포 없음)'
        type: boolean
        required: true
        default: false
  # Initial dry-run on the protected main merge of THIS workflow only.
  # An operator may re-run a failed read-only job at most twice. No schedule.
  push:
    branches: [main]
    paths: ['.github/workflows/gas-production-inventory-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.run_attempt <= 3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: portfolio-production-gas
    concurrency:
      group: gas-production-deploy
      cancel-in-progress: false
    env:
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_SERVER_FILE_NAME: ${{ vars.GAS_SERVER_FILE_NAME }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current main before release preflight or rerun
        if: github.event_name == 'push' || inputs.verify_9301 == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import {assertCurrentMainRelease} from "./scripts/gas-release-gate.mjs"; await assertCurrentMainRelease({sha:process.env.GITHUB_SHA,repository:process.env.GITHUB_REPOSITORY,token:process.env.GITHUB_TOKEN}); console.log("GAS9298_CURRENT_MAIN_READONLY_VERIFIED")'
      # The GET-only inventory permits one bounded transient transport retry.
      - name: Inspect all GAS deployments (GET only, no deployment or finance writes)
        run: node scripts/issue507-deployment-inventory-readonly.mjs

      - name: Verify published 9.300 ledger and idle Writer Gate (read only)
        id: finance_preflight
        if: github.event_name == 'push' || inputs.verify_9301 == true
        # Report the exact sanitized post-hash gate blocker class; no retry on active writer/version mismatch.
        # Relevant preflight correction triggers this single read-only push verification.
        run: node scripts/gas9298-release-readonly.mjs pre 9.301
      - name: GAS 9.301 NH diagnostic dry-run only (no production code write)
        if: github.event_name == 'push' || inputs.verify_9301 == true
        env:
          GAS_DEPLOY_DRY_RUN: 'true'
          GAS_9301_NH_DIAGNOSTIC: 'true'
          GAS_9301_RELEASE_APPROVAL: 'false'
          GAS_9301_LIVE_PREFLIGHT_VERIFIED: ${{ steps.finance_preflight.outputs.verified || 'false' }}
          GAS_EXPECTED_MAIN_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy-gas.mjs
