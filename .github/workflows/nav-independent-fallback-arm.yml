name: NAV independent source fallback arm
# A trusted external KST controller updates one dated sentinel when GitHub
# misses its own schedule. Dispatches existing, guarded NAV workflow only.
on:
  push:
    branches: [main]
    paths: ['ops/nav-independent-arm-trigger.txt']
permissions:
  contents: read
  actions: write
concurrency:
  group: nav-independent-source-fallback
  cancel-in-progress: false
jobs:
  guard-and-dispatch:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'ops: arm NAV fallback ')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify one-file main push, KST day and bounded arm time
        run: |
          set -euo pipefail
          sentinel='ops/nav-independent-arm-trigger.txt'
          before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          [[ "$before" =~ ^[0-9a-f]{40}$ ]] || { echo 'NAV_FALLBACK_BEFORE_UNVERIFIED'; exit 1; }
          [[ "$before" == "$(git rev-parse HEAD^)" ]] || { echo 'NAV_FALLBACK_NOT_ONE_COMMIT'; exit 1; }
          [[ "$(git diff --name-only HEAD^ HEAD)" == "$sentinel" ]] || { echo 'NAV_FALLBACK_WRONG_PATHS'; exit 1; }
          [[ "$(git ls-files --stage "$sentinel" | awk '{print $1}')" == '100644' ]] || { echo 'NAV_FALLBACK_MODE_INVALID'; exit 1; }
          [[ "$(wc -c < "$sentinel")" -lt 400 ]] || { echo 'NAV_FALLBACK_TOO_LARGE'; exit 1; }
          [[ "$(grep -Ec '^kind=portfolio-nav-fallback-v1$' "$sentinel" || true)" == '1' ]] || { echo 'NAV_FALLBACK_KIND_INVALID'; exit 1; }
          [[ "$(grep -Ec '^armed=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+09:00$' "$sentinel" || true)" == '1' ]] || { echo 'NAV_FALLBACK_TIME_INVALID'; exit 1; }
          [[ "$(wc -l < "$sentinel")" -eq 2 ]] || { echo 'NAV_FALLBACK_LINES_INVALID'; exit 1; }
          diff -q <(git show "HEAD^:$sentinel" | sed '/^armed=/d') <(sed '/^armed=/d' "$sentinel") >/dev/null || { echo 'NAV_FALLBACK_OTHER_FIELDS_CHANGED'; exit 1; }
          previous="$(git show "HEAD^:$sentinel" | sed -n 's/^armed=//p')"
          armed="$(sed -n 's/^armed=//p' "$sentinel")"
          [[ "$previous" != "$armed" ]] || { echo 'NAV_FALLBACK_DUPLICATE_VALUE'; exit 1; }
          kst_day="$(TZ=Asia/Seoul date +%F)"
          # Domestic NAV fallback is not a weekend writer. Friday NAV
          # publication lag is handled by the next eligible weekday.
          kst_weekday="$(TZ=Asia/Seoul date +%u)"
          if (( kst_weekday >= 6 )); then
            echo 'NAV_FALLBACK_WEEKEND_NO_DISPATCH'; exit 0
          fi
          [[ "${armed:0:10}" == "$kst_day" ]] || { echo 'NAV_FALLBACK_WRONG_KST_DAY'; exit 1; }
          kst_clock="$(TZ=Asia/Seoul date +%H%M)"
          # Morning protects the missed 09:10/09:30 wake-up; evening
          # protects missed 18:10/19:17 publication catches. Evening begins
          # well after the 19:00 GAS portfolio close critical section.
          if (( (10#$kst_clock < 1010 || 10#$kst_clock > 1210) &&
                (10#$kst_clock < 2020 || 10#$kst_clock > 2110) )); then
            echo 'NAV_FALLBACK_OUTSIDE_KST_ADMISSION_WINDOWS'; exit 1
          fi
          now_s="$(date +%s)"
          armed_s="$(date -d "$armed" +%s)"
          lag_s="$((now_s - armed_s))"
          if ((lag_s < -60 || lag_s > 7200)); then
            echo 'NAV_FALLBACK_ARM_STALE_OR_FUTURE'; exit 1
          fi
          echo 'NAV_FALLBACK_EXACT_ONE_FILE_KST_VERIFIED'
      - name: Skip if a trusted private NAV collection already succeeded or is running today
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kst_day="$(TZ=Asia/Seoul date +%F)"
          kst_weekday="$(TZ=Asia/Seoul date +%u)"
          if (( kst_weekday >= 6 )); then
            echo 'NAV_FALLBACK_WEEKEND_NO_DISPATCH'
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kst_clock="$(TZ=Asia/Seoul date +%H%M)"
          # In evening, an 09:10 successful-but-deferred NAV attempt must
          # not suppress recovery from missing evening scheduled wake-ups.
          # On each admission window dedupe only its trusted schedule period.
          if (( 10#$kst_clock >= 2020 && 10#$kst_clock <= 2110 )); then
            since="$(date -u -d "$kst_day 17:00:00 +0900" +%FT%TZ)"
            echo 'NAV_FALLBACK_EVENING_DEDUPE_SINCE_1700_KST'
          else
            # A 02:10/05:58 collector can succeed while the Friday NAV
            # is still unpublished. It must not suppress the *09:10/09:30*
            # source catch-up when that later cron is missing.
            since="$(date -u -d "$kst_day 08:45:00 +0900" +%FT%TZ)"
            echo 'NAV_FALLBACK_MORNING_DEDUPE_SINCE_0845_KST'
          fi
          recent="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kb-fund-nav-collect.yml/runs?per_page=50" |
            jq -r --arg since "$since" '[.workflow_runs[]
              | select(.created_at >= $since)
              | select(.head_branch == "main")
              | select(.event == "schedule" or .event == "workflow_dispatch")
              | select(.status != "completed" or .conclusion == "success")
            ] | length')"
          [[ "$recent" =~ ^[0-9]+$ ]] || { echo 'NAV_FALLBACK_DEDUPE_UNVERIFIED'; exit 1; }
          if ((recent > 0)); then
            echo 'NAV_FALLBACK_TRUSTED_COLLECTION_ALREADY_ACTIVE_OR_DONE'
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'NAV_FALLBACK_NO_TRUSTED_COLLECTION_SUCCESS'
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch existing protected NAV workflow (not NAV commit)
        if: steps.dedupe.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run kb-fund-nav-collect.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'NAV_FALLBACK_DISPATCH_ACCEPTED_NOT_NAV_COMMITTED'
