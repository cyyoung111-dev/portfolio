name: NH night read-only live verification 2026-11-05
# Single-use 08:00-13:00 KST diagnostic. No GAS deployment, NH OAuth issuance,
# Sheets mutations, Telegram sends or raw quote/credential logging.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nh-night-readback-20261105.yml', 'scripts/nh-gas-proxy.mjs']
permissions:
  contents: read
concurrency:
  group: nh-night-readonly-verification-20261105
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inspect same-day NH night GAS cache and verified tick without issuing new OAuth
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import {callNhGasProxy,fetchNhNightProbeFromGas,classifyGasHtml} from './scripts/nh-gas-proxy.mjs';
          import {fetchGoogleAuditToken} from './scripts/audit-published-gas-gate-readonly.mjs';
          const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{
            timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',
            hour:'2-digit',minute:'2-digit',hourCycle:'h23'
          }).formatToParts(new Date()).map(x=>[x.type,x.value]));
          const date=parts.year+'-'+parts.month+'-'+parts.day;
          const minute=Number(parts.hour)*60+Number(parts.minute);
          if(date!=='2026-11-05'||minute<480||minute>=780){
            console.log(JSON.stringify({kind:'NH_NIGHT_LIVE_READBACK',status:'OUTSIDE_VERIFIED_KST_WINDOW',
              date,nhCalls:0,gasWrites:0,financeWrites:0,telegramSends:0}));
            process.exit(0);
          }
          const url=process.env.GAS_WEB_APP_URL,token=process.env.GAS_ACCESS_TOKEN;
          if(!url||!token){
            console.log(JSON.stringify({kind:'NH_NIGHT_LIVE_READBACK',status:'GAS_CONFIG_UNAVAILABLE',
              date,nhCalls:0,gasWrites:0,financeWrites:0,telegramSends:0}));
            process.exitCode=1;
          }else{
            // Never disclose the actual deployment ID or endpoint. This is a
            // configuration parity check, not proof of production binding.
            const supplied=String(process.env.GAS_DEPLOYMENT_ID||'');
            const bound=/\/macros\/s\/([A-Za-z0-9_-]+)\/exec/.exec(url)?.[1]||'';
            const deploymentBinding=!supplied?'DEPLOYMENT_ID_NOT_CONFIGURED'
              :!bound?'ENDPOINT_INVALID':supplied===bound?'MATCH':'DIFFERENT';
            let htmlClass='NOT_HTML',responseStatus=0;
            const request=async(target,options)=>{
              const res=await fetch(target,options);
              if(res?.ok && Number.isInteger(res.status))responseStatus=res.status;
              if(String(res?.headers?.get?.('content-type')||'').toLowerCase().startsWith('text/html')){
                try{
                  const size=Number(res.headers?.get?.('content-length')||0);
                  htmlClass=size>120000?'HTML_TOO_LARGE'
                    :classifyGasHtml(await res.clone().text());
                }catch{htmlClass='HTML_CLASSIFICATION_FAILED';}
              }
              return res;
            };
            let state=null,statusCause='NONE';
            let transport={phase:'UNVERIFIED',httpStatus:0,
              responseHost:'UNKNOWN',redirect:'UNKNOWN',contentType:'UNKNOWN'};
            try{state=await callNhGasProxy('getNhAuthStatusProxy',{
              url,token,request,onTransportDiagnostic:details=>{
                const phases=['STATUS_OK','FETCH_FAILED','FETCH_TIMEOUT','HTTP_REJECTED',
                  'JSON_PARSE_FAILED','GAS_REJECTED','GAS_CONTRACT_REJECTED'];
                if(details?.kind!=='NH_GAS_TRANSPORT'||!phases.includes(details.phase))return;
                transport={phase:details.phase,
                  httpStatus:Number.isSafeInteger(details.httpStatus)?details.httpStatus:0,
                  responseHost:['GAS_WEB_APP','GOOGLE_CONTENT','OTHER'].includes(details.responseHost)
                    ?details.responseHost:'UNKNOWN',
                  redirect:['YES','NO'].includes(details.redirect)?details.redirect:'UNKNOWN',
                  contentType:['JSON','HTML','PLAIN','OTHER'].includes(details.contentType)
                    ?details.contentType:'UNKNOWN'};
              }
            });}
            catch(error){
              const reason=String(error?.message||'');
              statusCause=/^NH_PROXY_[A-Z0-9_]{1,70}$/.test(reason)
                ?reason:'NH_PROXY_UNKNOWN_FAILURE';
            }
            if(state&&!['ok'].includes(state.status))
              statusCause='GAS_STATUS_NOT_OK';
            else if(state?.status==='ok'&&
              (state.provider!=='NH'||state.readOnly!==true||state.enabled!==true))
              statusCause='GAS_STATUS_CONTRACT_UNVERIFIED';
            else if(state?.status==='ok'&&state.tokenCached===false)
              statusCause='NH_TOKEN_NOT_CACHED';
            const version=/^9\.\d{3}$/.test(String(state?.gasVersion||''))
              ?state.gasVersion:'UNVERIFIED';
            const authOk=state?.status==='ok'&&state?.provider==='NH'
              &&state?.readOnly===true&&state?.enabled===true
              &&state?.tokenIssued===false&&state?.tokenCached===true;
            console.log(JSON.stringify({kind:'NH_NIGHT_LIVE_STATUS',date,
              gasVersion:version,tokenCached:state?.tokenCached===true?'YES'
                :state?.tokenCached===false?'NO':'UNVERIFIED',
              tokenIssuanceRequested:false,verified:authOk,statusCause,transport,
              deploymentBinding,htmlClass,responseStatus,
              gasWrites:0,financeWrites:0}));
            if(!authOk){
              console.log(JSON.stringify({kind:'NH_NIGHT_LIVE_READBACK',
                status:'TOKEN_OR_GAS_STATUS_NOT_VERIFIED',date,nhCalls:0,
                gasWrites:0,financeWrites:0,telegramSends:0}));
              process.exitCode=1;
            }else{
              const reasons=[];
              let reference=null;
              try{reference=await fetchNhNightProbeFromGas(date,{
                now:()=>new Date(),url,token,
                onError:code=>{
                  if(/^NH_(?:NIGHT|PROXY)_[A-Z0-9_]{1,70}$/.test(code))
                    reasons.push(code);
                }
              });}catch{}
              const valid=reference?.kind==='REFERENCE'&&reference?.source==='NH'
                &&reference?.tradingDate===date&&reference?.clock==='06:00:00'
                &&reference?.sourceUpdatedAt===date+'T06:00:00+09:00'
                &&reference?.officialClose===false;
              console.log(JSON.stringify({kind:'NH_NIGHT_LIVE_READBACK',date,
                status:valid?'VERIFIED_READONLY_REFERENCE':'REFERENCE_UNVERIFIED',
                errorCode:valid?null:reasons[0]||'NO_VALID_0600_REFERENCE',
                source:valid?'NH':'UNVERIFIED',contractMonth:valid?reference.contractMonth:null,
                tradingDate:valid?reference.tradingDate:null,
                lastTickTime:valid?'06:00:00':null,
                officialClose:false,tokenIssuanceRequested:false,
                providerDirectCalls:false,gasWrites:0,financeWrites:0,telegramSends:0}));
              if(!valid)process.exitCode=1;
            }
          }
          // Independent Apps Script metadata GET: no GAS deployments, files,
          // triggers, tokens or finance rows are mutated. Do not disclose IDs.
          let binding={kind:'NH_GAS_WEBAPP_BINDING_20261105',
            status:'UNVERIFIED',entryPoint:'UNVERIFIED',access:'UNVERIFIED',
            executeAs:'UNVERIFIED',urlMatches:'UNVERIFIED',
            publishedVersion:'UNVERIFIED',
            googleGetCalls:0,gasWrites:0,financeWrites:0,telegramSends:0};
          try{
            const script=String(process.env.GAS_SCRIPT_ID||'');
            const dep=/\/macros\/s\/([A-Za-z0-9_-]+)\/exec/.exec(url||'')?.[1]||'';
            if(!/^[A-Za-z0-9_-]{8,160}$/.test(script)||!dep
              ||!process.env.CLASPRC_JSON)binding.status='METADATA_CONFIG_MISSING';
            else{
              const access=await fetchGoogleAuditToken({clasprc:process.env.CLASPRC_JSON});
              const response=await fetch('https://script.googleapis.com/v1/projects/'
                 +encodeURIComponent(script)+'/deployments/'+encodeURIComponent(dep),{
                method:'GET',headers:{Authorization:'Bearer '+access,
                  Accept:'application/json'},redirect:'error',
                signal:AbortSignal.timeout(16000)});
              binding.googleGetCalls=1;
              if(!response.ok){
                binding.status=[401,403,404,429,500,503].includes(response.status)
                  ?'DEPLOYMENT_HTTP_'+response.status:'DEPLOYMENT_HTTP_OTHER';
              }else{
                const record=await response.json();
                const points=Array.isArray(record?.entryPoints)
                  ?record.entryPoints.filter(p=>p?.entryPointType==='WEB_APP'):[];
                const verified=points.length===1
                  &&record?.deploymentId===dep;
                binding.entryPoint=verified?'WEB_APP':'UNVERIFIED';
                const cfg=points[0]?.webApp?.entryPointConfig;
                binding.access=['MYSELF','DOMAIN','ANYONE','ANYONE_ANONYMOUS']
                  .includes(cfg?.access)?cfg.access:'UNVERIFIED';
                binding.executeAs=['USER_DEPLOYING','USER_ACCESSING']
                  .includes(cfg?.executeAs)?cfg.executeAs:'UNVERIFIED';
                const target=points[0]?.webApp?.url;
                binding.urlMatches=typeof target==='string'
                  &&target===url?'YES':'UNVERIFIED_OR_DIFFERENT';
                binding.publishedVersion=Number.isSafeInteger(record?.deploymentConfig?.versionNumber)
                  &&record.deploymentConfig.versionNumber>0
                  ?'VERSIONED':'VERSION_UNVERIFIED';
                binding.status=verified?'METADATA_READ_OK':'METADATA_ID_OR_ENTRYPOINT_UNVERIFIED';
              }
            }
          }catch{
            binding.status='METADATA_READ_FAILED';
          }
          console.log(JSON.stringify(binding));
          NODE
