name: krx-operational-diagnostics

# One-time, read-only post-merge diagnostics. No scheduled recurrence or GAS writes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krx-operational-diagnostics.yml'
      - 'scripts/diagnose-krx-operational.mjs'
      - 'scripts/diagnose-k200-night-operational.mjs'
      - 'scripts/preview-krx-pending-reconcile.mjs'
      - 'scripts/diagnose-backfill-status.mjs'
  workflow_dispatch:
    inputs:
      dates:
        description: 'KRX official close dates (YYYY-MM-DD, comma separated)'
        type: string
        required: true
        default: '2026-10-12,2026-10-13,2026-10-14'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    # Three preview batches = 10 sequential HTTP calls (max 90s each),
    # plus market/K200 probes and job setup. Preserve time for all steps.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only KRX source status (no raw credentials or response bodies)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          DIAGNOSTIC_DATES: ${{ inputs.dates }}
        run: |
          node scripts/diagnose-krx-operational.mjs --dates "${DIAGNOSTIC_DATES:-2026-10-12,2026-10-13,2026-10-14}"

      - name: Read-only KRX K200 night match diagnostics
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          DIAGNOSTIC_DATES: ${{ inputs.dates }}
        run: |
          node scripts/diagnose-k200-night-operational.mjs --dates "${DIAGNOSTIC_DATES:-2026-10-13,2026-10-14}"

      - name: Preview stale KRX pending dates without mutation
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          DIAGNOSTIC_DATES: ${{ inputs.dates }}
        run: |
          node scripts/preview-krx-pending-reconcile.mjs --dates "${DIAGNOSTIC_DATES:-2026-10-12,2026-10-13,2026-10-14}" --allow-blocked

      # Completed Snapshot VALID does not by itself prove exact-date official
      # KRX / ledger completeness. Each date is independently checked by the
      # existing authenticated apply=0 endpoint, without mutating the queue.
      - name: Read-only exact KRX+ledger+full Snapshot proof for 10/06–08
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/preview-krx-pending-reconcile.mjs --dates "2026-10-06,2026-10-07,2026-10-08" --allow-blocked

      - name: Read-only exact KRX+ledger+full Snapshot proof for 10/15
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/preview-krx-pending-reconcile.mjs --dates "2026-10-15" --allow-blocked

      - name: Read-only backfill trigger and queue checkpoint (no GAS writes)
        if: always()
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: |
          node scripts/diagnose-backfill-status.mjs
