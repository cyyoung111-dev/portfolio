name: Briefing public-source timeliness probe (READ ONLY)
# Public, unauthenticated candidate availability only. No data writes, Telegram,
# trading API, NH OAuth, or production GAS reads/deploys.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/briefing-public-source-timeliness-readonly.yml'
      - 'scripts/probe-public-market-timeliness-readonly.mjs'
      - 'scripts/probe-kr-daily-reference-readonly.mjs'
      - 'scripts/qualify-public-market-session.mjs'
  workflow_dispatch:
  schedule:
    # Actual runner timestamp is logged; GitHub cron may start late.
    # 16:52, 17:08, 17:35 KST; next-morning 07:30 and 08:15 KST.
    - cron: '52 7 * * 1-5'
    - cron: '8 8 * * 1-5'
    - cron: '35 8 * * 1-5'
    - cron: '30 22 * * 0-4'  # 07:30 KST, before 07:40 briefing
    - cron: '15 23 * * 0-4'
permissions:
  contents: read
concurrency:
  group: briefing-public-timeliness-readonly
  cancel-in-progress: false
jobs:
  public_source_probe:
    if: >-
      github.repository == 'cyyoung111-dev/portfolio' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read public candidate quote schemas and published-date markers
        run: |
          node --check scripts/qualify-public-market-session.mjs
          node scripts/check-public-market-session-qualification.mjs
          node --check scripts/probe-public-market-timeliness-readonly.mjs
          node scripts/probe-public-market-timeliness-readonly.mjs
      - name: Prove Korean completed daily reference availability (PUBLIC READ ONLY)
        run: |
          node --check scripts/probe-kr-daily-reference-readonly.mjs
          node scripts/probe-kr-daily-reference-readonly.mjs
      - name: Verify official US Treasury par-yield curve publication lag (READ ONLY)
        run: |
          node --check scripts/probe-us-treasury-curve-readonly.mjs
          node scripts/probe-us-treasury-curve-readonly.mjs
