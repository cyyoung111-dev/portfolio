name: krx-holiday-20261008-source-only-fix

# A single verified metadata-only repair. Signed Snapshot backup and ScriptLock
# are mandatory in the existing GAS rewriteSnapshotDate endpoint. Subsequent
# pushes/edit/delete/re-add never auto-apply (immutable approved parent SHA).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krx-holiday-20261008-source-only-fix.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Explicitly apply source-only repair for 2026-10-08'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: krx-holiday-20261008-source-only-fix
  cancel-in-progress: false

jobs:
  source-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout approved merge parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Prove first installation from immutable reviewed main
        id: one_time
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REVIEWED_PARENT_SHA: b1122ab3d006c8695e42fbe0159e87acf1258ac4
        run: |
          set -euo pipefail
          echo "first=false" >> "$GITHUB_OUTPUT"
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$BEFORE_SHA" != "$REVIEWED_PARENT_SHA" ]; then exit 0; fi
          [ "$(git rev-parse HEAD^)" = "$BEFORE_SHA" ] || exit 1
          if git cat-file -e "$BEFORE_SHA:.github/workflows/krx-holiday-20261008-source-only-fix.yml" 2>/dev/null; then exit 0; fi
          echo "first=true" >> "$GITHUB_OUTPUT"
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reverify baseline and safely repair only fund-source differences
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
          SOURCE_ONLY_APPLY: ${{ ((github.event_name == 'push' && steps.one_time.outputs.first == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply)) && '1' || '0' }}
        run: node scripts/repair-krx-holiday-baseline-source.mjs
