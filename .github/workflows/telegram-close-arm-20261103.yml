name: Telegram November 3 17:00 one-off punctual fallback
# ONE-DAY ONLY. Armed early to avoid delayed GitHub cron enqueue.
# Same delivery/claim state as the normal closing briefing; never send twice.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-close-arm-20261102.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-close-briefing
  cancel-in-progress: false
jobs:
  close-once:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Arm and wait for 2026-11-03 17:00 KST, fail closed outside date
        id: arm
        run: |
          python3 - <<'PY'
          import datetime,os,sys,time
          from datetime import timezone,timedelta
          kst=timezone(timedelta(hours=9))
          now=datetime.datetime.now(kst)
          target=datetime.datetime(2026,11,3,17,0,tzinfo=kst)
          cutoff=datetime.datetime(2026,11,3,17,30,tzinfo=kst)
          lower=datetime.datetime(2026,11,3,15,0,tzinfo=kst)
          if now<lower or now>=cutoff:
              print("CLOSE_ONEOFF_OUTSIDE_DATE_OR_WINDOW")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("ready=false\n")
              sys.exit(0)
          print("CLOSE_ONEOFF_ARMED_FOR_1700_KST")
          while True:
              remaining=(target-datetime.datetime.now(kst)).total_seconds()
              if remaining<=0:break
              time.sleep(min(remaining,10.0))
          now=datetime.datetime.now(kst)
          if not (target<=now<cutoff):
              print("CLOSE_ONEOFF_CUTOFF")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("ready=false\n")
              sys.exit(0)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("ready=true\n")
          print("CLOSE_ONEOFF_REACHED_TARGET_WINDOW")
          PY
      - name: Prepare normal closing briefing under its original claim and clock gates
        if: steps.arm.outputs.ready == 'true'
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/telegram-close-workflow.mjs prepare
      - name: Claim normal closing delivery before contacting Telegram
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: .telegram-close-runtime/claim.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Send exactly one claimed closing market briefing
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-close-workflow.mjs send
      - name: Archive API-confirmed same-day SENT proof
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}-sent
          path: .telegram-close-runtime/sent.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
