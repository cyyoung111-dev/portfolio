name: issue860-gas9291-private-nav-preview
on:
  workflow_dispatch:
  # Exactly one protected preview when this file is merged to main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue860-gas9291-private-nav-preview.yml'
permissions:
  contents: read
concurrency:
  group: issue860-gas9291-private-nav-preview
  cancel-in-progress: false
jobs:
  kb-and-hanwha-readonly:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Offline private NAV exact-version and no-writer regression
        run: |
          node scripts/check-issue860-v9289-fund-collectors.mjs
          node scripts/check-issue860-fund-nav-release-compat.mjs
      - name: Preview KB fund NAV on deployed GAS (READ ONLY, no --apply)
        id: kb
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/collect-kb-fund-nav.mjs
      - name: Preview Hanwha C-RPe NAV on deployed GAS (READ ONLY, no --apply)
        id: hanwha
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/collect-hanwha-fund-nav.mjs
      - name: Fail if either independently reviewed preview is unavailable
        if: always()
        env:
          KB_OUTCOME: ${{ steps.kb.outcome }}
          HANWHA_OUTCOME: ${{ steps.hanwha.outcome }}
        run: |
          echo "KB private NAV: ${KB_OUTCOME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Hanwha private NAV: ${HANWHA_OUTCOME}" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${KB_OUTCOME}" != "success" ] || [ "${HANWHA_OUTCOME}" != "success" ]; then
            echo "ISSUE860_9291_NAV_PREVIEW_NOT_VERIFIED"
            exit 1
          fi
          echo "ISSUE860_9291_NAV_PREVIEW_VERIFIED_NO_WRITES"
