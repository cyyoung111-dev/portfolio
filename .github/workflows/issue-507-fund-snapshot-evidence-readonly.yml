name: issue-507-fund-snapshot-evidence-readonly
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue507-fund-snapshot-evidence-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Diagnose F00001 2026-10-30 persisted Snapshot vs price (read only)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-fund-snapshot-evidence-readonly.mjs
