name: issue-507-fund-snapshot-evidence-readonly
# 2026-11-03 one-off push event to correlate finance Snapshot + NH close
# without ANY production writes. Original manual dispatch is retained.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-507-fund-snapshot-evidence-readonly.yml']
permissions:
  contents: read
concurrency:
  group: issue507-fund-snapshot-evidence-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.run_attempt == 1))
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reject delayed 2026-11-03 one-shot; manual read-only mode preserved
        id: window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$(TZ=Asia/Seoul date +%F)" = "2026-11-03" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'ISSUE507_NH_READONLY_WINDOW_VALID'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'ISSUE507_NH_READONLY_ONEOFF_EXPIRED'
          fi
      - name: Validate existing source-only read contracts
        if: steps.window.outputs.ready == 'true'
        run: |
          node scripts/check-issue507-fund-snapshot-evidence-readonly.mjs
          node scripts/check-issue507-oct30-domestic-close-readonly.mjs
          node scripts/check-issue507-mobile-remote-readonly.mjs
      - name: Read persisted F00001 and F00002 fund/NAV provenance (never writes)
        id: funds
        if: steps.window.outputs.ready == 'true'
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-fund-snapshot-evidence-readonly.mjs
      - name: Read exact-date 2026-10-30 NH/stock close coverage (never writes)
        id: closes
        if: steps.window.outputs.ready == 'true'
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-oct30-domestic-close-readonly.mjs
      - name: Audit historical deferred Snapshot dates (read only, no queue changes)
        id: historical
        if: steps.window.outputs.ready == 'true'
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-deferred-source-audit-readonly.mjs
      - name: Audit last seven days F00001-F00003 NAV and Snapshot states (read only)
        id: nav
        if: steps.window.outputs.ready == 'true'
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/diagnose-fund-valuation-readonly.mjs
      - name: Verify remote trade and holding reads without loading user devices
        id: mobile
        if: steps.window.outputs.ready == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-mobile-remote-readonly.mjs
      - name: Preview exact KB S-T NAV source without importing or refreshing
        id: kbpreview
        if: steps.window.outputs.ready == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          preview="$(node scripts/collect-kb-fund-nav.mjs)"
          NAV_PREVIEW_OUTPUT="$preview" node --input-type=module <<'JS'
          let result;
          try { result=JSON.parse(process.env.NAV_PREVIEW_OUTPUT||'null'); } catch {}
          if(result?.mode!=='DRY_RUN'||result?.imported!==0
             ||!Number.isSafeInteger(result?.sourceRows)||result.sourceRows<1
             ||!Number.isSafeInteger(result?.candidates)||result.candidates<0) {
            console.error('KB_NAV_PREVIEW_INCOMPLETE');
            process.exit(2);
          }
          console.log('KB_NAV_DRY_RUN_SOURCE_VERIFIED_NO_WRITES');
          JS
      - name: Report all read-only evidence; no financial repair authorization
        if: always()
        env:
          READY: ${{ steps.window.outputs.ready }}
          FUNDS: ${{ steps.funds.outcome }}
          CLOSES: ${{ steps.closes.outcome }}
          HISTORICAL: ${{ steps.historical.outcome }}
          NAV: ${{ steps.nav.outcome }}
          MOBILE: ${{ steps.mobile.outcome }}
          KBPREVIEW: ${{ steps.kbpreview.outcome }}
        shell: bash
        run: |
          echo "JOINT_READONLY_FUND_STATUS=$FUNDS"
          echo "JOINT_READONLY_NH_CLOSE_STATUS=$CLOSES"
          echo "JOINT_READONLY_HISTORICAL_STATUS=$HISTORICAL"
          echo "JOINT_READONLY_NAV_STATUS=$NAV"
          echo "JOINT_READONLY_MOBILE_SOURCE_STATUS=$MOBILE"
          echo "JOINT_READONLY_KB_NAV_PREVIEW_STATUS=$KBPREVIEW"
          echo 'JOINT_READONLY_FINANCE_WRITES=0'
          echo 'JOINT_READONLY_RELEASE_AUTHORIZED=false'
          if [ "$READY" != 'true' ] || [ "$FUNDS" != 'success' ] || [ "$CLOSES" != 'success' ] || [ "$HISTORICAL" != 'success' ] || [ "$NAV" != 'success' ]; then
            echo 'JOINT_READONLY_EVIDENCE_INCOMPLETE'
            exit 2
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$MOBILE" != 'success' ] || [ "$KBPREVIEW" != 'success' ]; }; then
            echo 'JOINT_READONLY_FOLLOWUP_EVIDENCE_INCOMPLETE'
            exit 2
          fi
          echo 'JOINT_READONLY_EVIDENCE_COLLECTED_REVIEW_REQUIRED'
