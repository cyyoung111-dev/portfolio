name: GAS 9.288 trade v2 source review (NO DEPLOY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gas9288-trade-v2-source-review.yml'
  pull_request:
    paths:
      - 'scripts/compose-gas9288-trade-v2-from-9287-preview.mjs'
      - 'scripts/check-gas9288-trade-v2-from-9287-preview.mjs'
      - 'scripts/stage-gas9288-trade-v2-review-artifact.mjs'
      - 'scripts/trade-v2-gas-functions.mjs'
      - 'scripts/trade-v2-gas-receipts.mjs'
      - 'scripts/trade-v2-gas-migration-preview.mjs'
      - 'scripts/compose-fund-snapshot-9287-source-preview.mjs'
      - 'scripts/compose-gas9286-integrated-preview.mjs'
      - '.github/workflows/gas9288-trade-v2-source-review.yml'
permissions:
  contents: read
jobs:
  source-only:
    if: github.repository == 'cyyoung111-dev/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify protected v9.287 parent and v2 ID CAS source-only candidate
        run: |
          node scripts/check-trade-v2-post9287-release-boundary.mjs
          node scripts/check-gas9288-trade-v2-from-9287-preview.mjs
      - name: Stage immutable v9.288 source for independent review
        run: node scripts/stage-gas9288-trade-v2-review-artifact.mjs
      - name: Store candidate and exact reviewed-parent manifest
        uses: actions/upload-artifact@v4
        with:
          name: gas9288-trade-v2-source-only-${{ github.sha }}
          path: artifacts/gas9288-trade-v2-review/
          retention-days: 30
          if-no-files-found: error
