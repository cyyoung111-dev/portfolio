name: probe-standalone-performance-gas-20261103
on:
  pull_request:
    paths:
      - 'scripts/probe-standalone-performance-gas.mjs'
      - '.github/workflows/probe-standalone-performance-gas-20261103.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-standalone-performance-gas-20261103.yml'

permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test standalone telemetry read-only probe
        run: node scripts/probe-standalone-performance-gas.mjs --self-test
  live-readonly:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'cyyoung111-dev/portfolio'
    runs-on: ubuntu-latest
    environment: portfolio-production-gas
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read isolated deployment authorized summary without writing data
        env:
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/probe-standalone-performance-gas.mjs
