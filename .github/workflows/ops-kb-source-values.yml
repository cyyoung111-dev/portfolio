name: OPS 20261007 fetch public FunETF S-T NAV values
on:
  push:
    paths: [.github/workflows/ops-kb-source-values.yml]
    branches: [ops/diagnose-close-nav-20261007]
permissions:
  contents: read
jobs:
  public-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate class-exact public fund NAV data
        run: |
          node --input-type=module <<'NODE'
          const u=new URL('https://www.funetf.co.kr/api/public/product/view/fundnav');
          Object.entries({fundCd:'KR5223AQ0185',gijunYmd:'20261006',schNavMode:'',
            schNavStDt:'20260922',schNavEdDt:'20261006'}).forEach(([k,v])=>u.searchParams.set(k,v));
          const response=await fetch(u,{headers:{
            Accept:'application/json, text/plain, */*','Accept-Language':'ko-KR,ko;q=0.9',
            Referer:'https://www.funetf.co.kr/product/fund/view/KR5223AQ0185',
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'},
            signal:AbortSignal.timeout(20000)});
          if(!response.ok)throw Error('PUBLIC_API_HTTP_'+response.status);
          const raw=await response.json();
          if(!Array.isArray(raw)||!raw.length)throw Error('NO_ROWS');
          const vals=raw.map(x=>{
            const date=String(x.gijunYmd||'');
            const nav=Number(String(x.gijunGa||'').replaceAll(',',''));
            if(!/^2026(09|10)[0-9]{2}$/.test(date)||!Number.isFinite(nav)||nav<=0)throw Error('INVALID_DATE_OR_NAV');
            return {date:date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8),nav};
          }).sort((a,b)=>a.date.localeCompare(b.date));
          if(new Set(vals.map(x=>x.date)).size!==vals.length)throw Error('DUPLICATES');
          console.log('FUNETF_VERIFIED_VALUES '+JSON.stringify({provider:'FunETF',standardCode:'KR5223AQ0185',rows:vals}));
          NODE
