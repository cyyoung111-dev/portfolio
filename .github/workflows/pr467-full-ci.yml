name: PR 467 full CI validation

on:
  push:
    branches:
      - fix/close-price-freshness-kb-nav-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock --no-audit --no-fund
          fi
      - name: Run full CI
        run: npm run check:ci
      - name: Read-only FunETF S-T NAV endpoint status
        if: always()
        run: |
          node --input-type=module <<'NODE'
          const url = new URL('https://www.funetf.co.kr/api/public/product/view/fundnav');
          Object.entries({
            fundCd:'KR5223AQ0185',gijunYmd:'20261006',schNavMode:'',
            schNavStDt:'20260922',schNavEdDt:'20261006'
          }).forEach(([k,v]) => url.searchParams.set(k,v));
          try {
            const res=await fetch(url,{
              headers:{Accept:'application/json, text/plain, */*','Accept-Language':'ko-KR,ko;q=0.9',
                Referer:'https://www.funetf.co.kr/product/fund/view/KR5223AQ0185',
                'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'},
              signal:AbortSignal.timeout(15000)
            });
            const body=await res.text();
            let data; try{data=JSON.parse(body)}catch{}
            const rows=Array.isArray(data)?data:null;
            const first=rows?.[0]??null;
            console.log(JSON.stringify({provider:'FunETF',standardCode:'KR5223AQ0185',status:res.status,
              contentType:res.headers.get('content-type'),isJson:!!data,rowCount:rows?.length??null,
              firstKeys:first?Object.keys(first):null,firstDate:first?.gijunYmd??null,
              lastDate:rows?.at(-1)?.gijunYmd??null}));
          } catch (e) {console.log(JSON.stringify({provider:'FunETF',fetchError:e.name,diagnostic:'network/timeout'}));}
          NODE
