name: issue-507-historic-krx-held-readonly

# Year-end 2025 confirmed-source coverage for the ledger-held KRX universe.
# Never rewrites GAS source, prices, trades, Snapshot, or queues.
on:
  pull_request:
    paths:
      - 'scripts/issue507-historic-krx-held-readonly.mjs'
      - 'scripts/diagnose-krx-held-coverage.mjs'
      - '.github/workflows/issue-507-historic-krx-held-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/issue507-historic-krx-held-readonly.mjs'
      - 'scripts/diagnose-krx-held-coverage.mjs'
      - '.github/workflows/issue-507-historic-krx-held-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate read-only producer and non-sensitive historical coverage
        run: |
          node --check scripts/issue507-historic-krx-held-readonly.mjs
          node scripts/check-krx-held-operational.mjs
          node scripts/issue507-historic-krx-held-readonly.mjs --self-test

  operational-readonly:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Historical official KRX coverage on 2025-09-03, 2025-12-30, 2026-01-02
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue507-historic-krx-held-readonly.mjs
