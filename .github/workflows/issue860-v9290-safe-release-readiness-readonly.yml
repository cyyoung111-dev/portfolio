name: issue860-v9290-safe-release-readiness-readonly
on:
  workflow_dispatch:
  # One on-merge production proof. No deploy, NAV import, trigger, or sheet write.
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue860-v9290-safe-release-readiness-readonly.yml'
permissions:
  contents: read
concurrency:
  group: issue860-v9290-safe-release-readiness-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'cyyoung111-dev/portfolio' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: portfolio-production-gas
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read-only source contract
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          fi
          node scripts/check-issue860-v9290-live-gate.mjs
      - name: Prove release safety separately from close finality (READ ONLY)
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
          GAS_ACCESS_TOKEN: ${{ secrets.GAS_ACCESS_TOKEN }}
        run: node scripts/issue860-v9290-live-gate.mjs
